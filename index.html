  // ── 집계
  const dailyTasks   = OPS_TASKS.filter(t=>t.period==='daily');
  const dailyDone    = dailyTasks.filter(t=>t.done).length;
  const weeklyTasks  = OPS_TASKS.filter(t=>t.period==='weekly');
  const weeklyDone   = weeklyTasks.filter(t=>t.done).length;
  const monthlyTasks = OPS_TASKS.filter(t=>t.period==='monthly');
  const monthlyDone  = monthlyTasks.filter(t=>t.done).length;

  const unresolved   = OPS_MEMBER_COND.filter(m=>!m.resolved).length;
  const lowStock     = OPS_INVENTORY.filter(i=>i.cur<i.min);
  const outStock     = OPS_INVENTORY.filter(i=>i.cur===0);

  const recentMc     = OPS_MEMBER_COND.filter(m=>!m.resolved).slice(0,3);

  const dPct=dailyTasks.length?Math.round(dailyDone/dailyTasks.length*100):0;
  const wPct=weeklyTasks.length?Math.round(weeklyDone/weeklyTasks.length*100):0;

function rOpsMemberCondHTML(){
  const typeMap={
    '전체':{icon:'🧘',color:'var(--teal)'},
    '결석':{icon:'🚫',color:'#E65100'},
    '컨디션':{icon:'💪',color:'var(--purp)'},
    '부상':{icon:'🩹',color:'var(--red)'},
    '피드백':{icon:'💬',color:'var(--grn)'},

  const typeBadgeCls={'결석':'mc-type-abs','컨디션':'mc-type-cond','피드백':'mc-type-fb','부상':'mc-type-inj'};
  const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;

  const filtered = mcFilter==='전체'
    ? OPS_MEMBER_COND
    : OPS_MEMBER_COND.filter(r=>r.type===mcFilter);

  // 미처리 건수

  let h=``;

  // 요약 배너
  if(unresolved>0){
    h+=`<div style="background:#FEF3E2;border-radius:var(--rm);padding:10px 13px;margin-bottom:12px;border:1px solid #FFCC80;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:11px;font-weight:700;color:#E65100">⚠️ 미처리 ${unresolved}건</div>

  // 기록 카드

    h+=`<div class="es"><span class="ei">🧘</span><p>해당하는 기록이 없어요</p></div>`;

    sorted.forEach((rec,i)=>{
      const gi=OPS_MEMBER_COND.indexOf(rec);
      const mem=mById(rec.memId);

      const badgeCls=typeBadgeCls[rec.type]||'mc-type-cond';

      h+=`<div class="mc-card${rec.resolved?' done':''}">
        <!-- 카드 헤더 (클릭으로 펼침) -->
        <div class="mc-header" style="cursor:pointer" onclick="opsExpandId=opsExpandId==='${rec.id}'?null:'${rec.id}';render()">
          ${mem
            ?`<div class="mc-av" style="background:${mem.bg};color:${mem.tc}">${mem.init}</div>`
            :`<div class="mc-av" style="background:var(--tl);color:var(--td)">?</div>`}
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="mc-name">${mem?.name||'알 수 없음'}</span>
              <span class="mc-type-badge ${badgeCls}">${rec.type}</span>

            </div>
            <div class="mc-date">${rec.date} · ${rec.author} 작성 · 댓글 ${rec.replies.length}</div>
          </div>
          <span style="font-size:16px;color:var(--g40);transition:transform .2s;${isOpen?'transform:rotate(90deg)':''}">›</span>
        </div>

        <!-- 본문 (펼침 시) -->
        ${isOpen?`
        <div style="border-top:1px solid var(--g10);padding-top:9px">
          <div class="mc-body">${rec.body.replace(/\n/g,'<br>')}</div>

          <!-- 댓글 목록 -->
          ${rec.replies.length?`
          <div class="mc-reply-wrap">
            <div style="font-size:10px;font-weight:700;color:var(--g60);margin-bottom:6px">💬 스탭 의견 (${rec.replies.length})</div>
            ${rec.replies.map(r=>`
            <div class="mc-reply-item">
              <span class="mc-reply-who">${r.who}</span>
              <span style="font-size:9px;color:var(--g60)">${r.date}</span>

// ── 업무 체크리스트
function rOpsTaskHTML(){
  let h=`
  <!-- 기간 선택 -->
  <div class="ops-period-row">
    <button class="ops-period${opsPeriod==='daily'?' on':''}" onclick="opsPeriod='daily';render()">📅 일간</button>
    <button class="ops-period${opsPeriod==='weekly'?' on':''}" onclick="opsPeriod='weekly';render()">📆 주간</button>
    <button class="ops-period${opsPeriod==='monthly'?' on':''}" onclick="opsPeriod='monthly';render()">🗓️ 월간</button>
  </div>`;

  const tasks=OPS_TASKS.filter(t=>t.period===opsPeriod);
  const done=tasks.filter(t=>t.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;

  h+=`
  <!-- 진행률 -->
  <div style="background:var(--w);border-radius:var(--rm);padding:11px 13px;margin-bottom:12px;border:1px solid var(--g10)">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:11px;font-weight:700;color:var(--blk)">${{daily:'일간',weekly:'주간',monthly:'월간'}[opsPeriod]} 업무 진행률</span>
      <span style="font-size:11px;font-weight:700;color:${pct===100?'var(--grn)':'var(--teal)'}">${done}/${tasks.length} · ${pct}%</span>
    </div>
    <div style="background:var(--g20);border-radius:20px;height:9px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${pct===100?'var(--grn)':'var(--teal)'};border-radius:20px;transition:width .5s"></div>
    </div>
    ${pct===100?`<div style="text-align:center;font-size:11px;color:var(--grn);margin-top:6px;font-weight:700">🎉 모든 업무 완료!</div>`:''}
  </div>`;

  // 카테고리별 그룹핑
  const cats=[...new Set(tasks.map(t=>t.cat))];
  const catIcons={회원:'👥',시설:'🏃',운영:'📊',재고:'📦',기구:'🔧'};

  cats.forEach(cat=>{
    const catTasks=tasks.filter(t=>t.cat===cat);
    const catDone=catTasks.filter(t=>t.done).length;
    h+=`<div style="font-size:10px;font-weight:700;color:var(--g60);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;margin-top:10px">
      ${catIcons[cat]||'📋'} ${cat} (${catDone}/${catTasks.length})
    </div>`;
    catTasks.forEach((t,i)=>{
      const gi=OPS_TASKS.indexOf(t);
      h+=`<div class="task-item${t.done?' done':''}" onclick="toggleOpsTask(${gi})">
        <div class="task-cb${t.done?' done':''}${t.priority==='hi'&&!t.done?' hi':''}">${t.done?'✓':''}</div>
        <div class="task-body">
          <div class="task-title${t.done?' done':''}">${t.title}</div>
          <div class="task-meta">${t.note}</div>
          <div class="task-badges">
            <span class="task-who">${t.assignee}</span>
            <span class="task-pri ${t.priority}">${{hi:'🔴 필수',md:'🟡 권장',lo:'🟢 선택'}[t.priority]}</span>
          </div>
          ${t.done&&t.doneAt?`<div class="task-done-info">✅ ${t.doneBy} · ${t.doneAt}</div>`:''}
        </div>
        ${role==='admin'?`<button onclick="event.stopPropagation();deleteOpsTask(${gi})" style="border:none;background:none;color:var(--g30);font-size:12px;cursor:pointer;padding:2px;flex-shrink:0">✕</button>`:''}
      </div>`;
    });
  });

  if(!tasks.length) h+=`<div class="es"><span class="ei">✅</span><p>등록된 업무가 없어요</p></div>`;
  return h;
}

function toggleOpsTask(gi){
  const t=OPS_TASKS[gi]; if(!t) return;
  t.done=!t.done;
  if(t.done){
    t.doneBy=role==='admin'?'관리자':loggedUser.name;
    t.doneAt=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
  } else {
    t.doneBy=''; t.doneAt='';
  }
  render();
}

function deleteOpsTask(gi){
  if(!confirm('이 업무를 삭제하시겠습니까?')) return;
  OPS_TASKS.splice(gi,1); render();
}

function rOpsInventoryHTML(){
  const cats=[...new Set(OPS_INVENTORY.map(i=>i.cat))];

  const lowItems=OPS_INVENTORY.filter(i=>i.cur<i.min);

  let h='';

  // 부족 알림 배너
  if(lowItems.length){
    h+=`<div style="background:#FDECEA;border-radius:var(--rm);padding:10px 13px;margin-bottom:12px;border:1px solid #FFCDD2">
      <div style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:5px">⚠️ 재고 부족 항목 ${lowItems.length}개</div>
      ${lowItems.map(i=>`<div style="font-size:10px;color:var(--red);margin-bottom:1px">• ${i.name} — 현재 ${i.cur}${i.unit} (최소 ${i.min}${i.unit} 필요)</div>`).join('')}
    </div>`;
  }

  cats.forEach(cat=>{
    const items=OPS_INVENTORY.filter(i=>i.cat===cat);
    h+=`<div style="font-size:10px;font-weight:700;color:var(--g60);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;margin-top:10px">
      ${catIcons[cat]||'📦'} ${cat}
    </div>`;
    items.forEach((item,idx)=>{
      const gi=OPS_INVENTORY.indexOf(item);
      const pct=Math.min(100,Math.round(item.cur/item.max*100));
      const status=item.cur<=0?'out':item.cur<item.min?'low':'ok';
      const barColor={'ok':'var(--grn)','low':'var(--wt)','out':'var(--red)'}[status];
      h+=`<div class="inv-card">
        <div class="inv-header">
          <div>
            <div class="inv-name">${item.name}</div>
            <div class="inv-cat">${item.cat} · 발주단위: ${item.orderUnit}</div>
          </div>
          ${role==='admin'?`<div style="display:flex;gap:5px;align-items:center">
            <button onclick="adjInv(${gi},-1)" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--g20);background:none;font-size:14px;cursor:pointer;font-family:var(--font)">−</button>
            <button onclick="adjInv(${gi},1)" style="width:26px;height:26px;border-radius:50%;border:1.5px solid var(--teal);background:var(--tl);color:var(--td);font-size:14px;cursor:pointer;font-family:var(--font)">+</button>
          </div>`:''}
        </div>
        <div class="inv-stock-bar">
          <div class="inv-stock-fill" style="width:${pct}%;background:${barColor}"></div>
        </div>
        <div class="inv-nums">
          <span class="inv-cur ${status}">${item.cur}${item.unit} ${status==='out'?'⛔':status==='low'?'⚠️':'✅'}</span>
          <span class="inv-min">최소 ${item.min} · 최대 ${item.max}${item.unit}</span>
        </div>
      </div>`;
    });
  });

  if(role==='admin') h+=`<div style="text-align:center;margin-top:6px"><button class="al" onclick="openAddInvModal()">+ 재고 항목 추가</button></div>`;
  return h;
}

function adjInv(gi, delta){
  const item=OPS_INVENTORY[gi]; if(!item) return;
  item.cur=Math.max(0,Math.min(item.max,item.cur+delta));
  render();
}

        <span style="font-size:16px;color:var(--g40);transform:rotate(${isOpen?'90':'0'}deg);transition:transform .2s">›</span>
      </div>
      ${isOpen?`
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--g10)">

}

function drawAnalyticsCharts(mData, tab){
  const safe=(id,fn)=>{
    if(analyticsCharts[id]) try{analyticsCharts[id].destroy();}catch(e){}
    const el=document.getElementById(id); if(!el) return;
    try{ analyticsCharts[id]=fn(el); }catch(e){}
  };

  const teal='#2E93A8',tealA='rgba(46,147,168,.15)';
  const grn='#2E7D52',grnA='rgba(46,125,82,.12)';
  const red='#D64444',redA='rgba(214,68,68,.12)';
  const pur='#6B4FBF',purA='rgba(107,79,191,.12)';
  const baseOpt={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(30,30,30,.85)',titleFont:{size:9},bodyFont:{size:11,weight:'600'},padding:7}},
    scales:{x:{grid:{display:false},ticks:{font:{size:9},color:'#8A8A85'}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:9},color:'#8A8A85'},beginAtZero:true}}};

  if(tab==='overview'){
    safe('cRevMain', el=>new Chart(el,{type:'bar',
      data:{labels:mData.map(d=>d.label),datasets:[
        {label:'매출',data:mData.map(d=>d.rev),backgroundColor:tealA,borderColor:teal,borderWidth:2,borderRadius:4},
        {label:'순이익',data:mData.map(d=>d.profit),type:'line',borderColor:grn,backgroundColor:'transparent',borderWidth:2.5,pointRadius:4,tension:.3},
      ]},
      options:{...baseOpt,plugins:{...baseOpt.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:10,font:{size:9},color:'#8A8A85'}}}}}));
  }
  else if(tab==='members'){
    // Member revenue contribution
    const memRevs=MEMBERS.map(m=>{
      const total=REG_HISTORY.filter(r=>r.memId===m.id).reduce((a,r)=>a+r.amount,0);
      return {name:m.name,rev:total,bg:m.bg.replace('#','')};
    }).filter(m=>m.rev>0);
    safe('cMemRev',el=>new Chart(el,{type:'bar',
      data:{labels:memRevs.map(m=>m.name),datasets:[{data:memRevs.map(m=>m.rev),backgroundColor:memRevs.map(m=>tealA),borderColor:memRevs.map(()=>teal),borderWidth:2,borderRadius:4}]},
      options:baseOpt}));
  }
  else if(tab==='expenses'){
    // Pie/doughnut for expense breakdown
    const expEntries=Object.values(FIXED_EXPENSES);
    const thisPayTotal=PAYROLL.filter(p=>p.year===TY&&p.month===TM).reduce((a,p)=>{recomputePR(p);return a+p.netPay;},0);
    const allExp=[...expEntries.map(e=>({label:e.label,val:e.amount})),{label:'강사급여',val:thisPayTotal}];
    const colors=['#2E93A8','#2E7D52','#6B4FBF','#D64444','#E07B39','#8A5A00','#3D7DD4','#9C3D8A'];
    safe('cExp',el=>new Chart(el,{type:'doughnut',
      data:{labels:allExp.map(e=>e.label),datasets:[{data:allExp.map(e=>e.val),backgroundColor:colors.map(c=>c+'33'),borderColor:colors,borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'55%',
        plugins:{legend:{display:true,position:'right',labels:{boxWidth:9,font:{size:9},color:'#8A8A85'}},tooltip:{backgroundColor:'rgba(30,30,30,.85)',titleFont:{size:9},bodyFont:{size:10},padding:6}}}}));
    // Expense trend
    safe('cExpTrend',el=>new Chart(el,{type:'line',
      data:{labels:mData.map(d=>d.label),datasets:[
        {label:'고정비',data:mData.map(()=>getTotalFixedExp()),borderColor:red,backgroundColor:redA,borderWidth:2,fill:true,tension:0,pointRadius:3},
        {label:'강사급여',data:mData.map(d=>getMonthPayroll(d.y,d.m)),borderColor:pur,backgroundColor:purA,borderWidth:2,fill:false,tension:.3,pointRadius:3},
      ]},
      options:{...baseOpt,plugins:{...baseOpt.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:9,font:{size:9},color:'#8A8A85'}}}}}));
  }
  else if(tab==='target'){
    const months12=getAnalyticsMonths(12);
    const mLine=months12.map(({y,m})=>REVENUE_TARGETS.monthly);
    const mActual=months12.map(({y,m})=>getMonthRevenue(y,m));
    safe('cTarget',el=>new Chart(el,{type:'line',
      data:{labels:months12.map(({m})=>MN_KR[m]),datasets:[
        {label:'실제 매출',data:mActual,borderColor:teal,backgroundColor:tealA,borderWidth:2.5,pointRadius:4,fill:true,tension:.3},
        {label:'월 목표',data:mLine,borderColor:red,backgroundColor:'transparent',borderWidth:1.5,borderDash:[6,4],pointRadius:0,fill:false,tension:0},
      ]},
      options:{...baseOpt,plugins:{...baseOpt.plugins,legend:{display:true,position:'bottom',labels:{boxWidth:9,font:{size:9},color:'#8A8A85'}}}}}));
  }
}

function rRev(B){
  const months=getAllMonths(revPeriod);
  const monthData=months.map(({y,m})=>{
    const ss=getMonthSessions(y,m);
    const revenue=ss.reduce((a,s)=>a+s.fee,0);
    const count=ss.length;
    const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    return {label:MN[m],revenue,count,y,m};
  });

  const curM=getMonthSessions(TY,TM);
  const curRev=curM.reduce((a,s)=>a+s.fee,0);
  const curCount=curM.length;
  const totalRev=SESSIONS.reduce((a,s)=>a+s.fee,0);

  // Pay summary
  const curPayIns1=getMonthSessions(TY,TM).filter(s=>s.insId==='ins1');
  const curPayIns2=getMonthSessions(TY,TM).filter(s=>s.insId==='ins2');
  const calcPay=(ss,ins)=>{
    const gross=ss.length*ins.hourlyRate;
    return {gross,net:Math.round(gross*(1-ins.taxRate)),sessions:ss.length};
  };
  const p1=calcPay(curPayIns1,INSTRUCTORS[0]);
  const p2=calcPay(curPayIns2,INSTRUCTORS[1]);

  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <span class="sec" style="margin-bottom:0">이번 달 현황</span>
    <div class="month-sw">
      ${[3,6,12].map(n=>`<button class="msw${revPeriod===n?' on':''}" onclick="revPeriod=${n};render()">${n}개월</button>`).join('')}
    </div>
  </div>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-lbl">이번 달 매출</div><div class="stat-val teal">${curRev.toLocaleString()}원</div><div class="stat-sub">수업 ${curCount}건</div></div>
    <div class="stat-box"><div class="stat-lbl">누적 매출</div><div class="stat-val grn">${totalRev.toLocaleString()}원</div><div class="stat-sub">총 ${SESSIONS.length}건</div></div>
    <div class="stat-box"><div class="stat-lbl">이번 달 강사 급여 (합산)</div><div class="stat-val pur">${(p1.net+p2.net).toLocaleString()}원</div><div class="stat-sub">세후 지급액</div></div>
    <div class="stat-box"><div class="stat-lbl">순이익 추정</div><div class="stat-val teal">${(curRev-p1.net-p2.net).toLocaleString()}원</div><div class="stat-sub">매출 - 강사급여</div></div>
  </div>`;

  // Revenue bar chart
  h+=`<div class="chart-wrap"><div class="chart-title">📊 월별 매출 추이</div><div class="chart-h"><canvas id="cRev"></canvas></div></div>`;

  // Session count chart
  h+=`<div class="chart-wrap"><div class="chart-title">📈 월별 수업 건수</div><div class="chart-h"><canvas id="cCount"></canvas></div></div>`;

  // Instructor breakdown
  h+=`<div class="sec">강사별 이번 달 급여</div>`;
  INSTRUCTORS.forEach(ins=>{
    const ss=getMonthSessions(TY,TM).filter(s=>s.insId===ins.id);
    const gross=ss.length*ins.hourlyRate;
    const tax=Math.round(gross*ins.taxRate);
    const net=gross-tax;
    h+=`<div class="pay-card">
      <div class="pay-head"><span class="pay-name">🧑‍🏫 ${ins.name}</span><span class="pill pt">${ss.length}회 수업</span></div>
      <div class="pay-detail">
        <div class="pay-detail-row"><span>수업 횟수</span><span>${ss.length}회</span></div>
        <div class="pay-detail-row"><span>시간당 단가</span><span>${ins.hourlyRate.toLocaleString()}원</span></div>
        <div class="pay-detail-row"><span>세전 급여</span><span>${gross.toLocaleString()}원</span></div>
        <div class="pay-detail-row"><span>원천징수 (3.3%)</span><span>-${tax.toLocaleString()}원</span></div>
        <div class="pay-detail-row"><span>💰 실지급액</span><span style="color:var(--td)">${net.toLocaleString()}원</span></div>
      </div>
      <button class="sbtn cf" style="width:100%;padding:8px;border-radius:var(--rm);font-size:11px" onclick="openInsContract('${ins.id}')">📋 프리랜서 계약서 보기</button>
    </div>`;
  });

  // Session log table
  const curLogs=getMonthSessions(TY,TM).sort((a,b)=>new Date(b.date.replace(/-/g,'/'))-new Date(a.date.replace(/-/g,'/')));
  h+=`<div class="sec" style="margin-top:6px">이번 달 수업 내역 (${curLogs.length}건)</div>`;
  if(curLogs.length){
    h+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:10px">
      <tr style="background:var(--tl)"><th style="padding:5px 7px;text-align:left;color:var(--tdd)">날짜</th><th style="padding:5px 7px;text-align:left;color:var(--tdd)">강사</th><th style="padding:5px 7px;text-align:left;color:var(--tdd)">회원</th><th style="padding:5px 7px;text-align:right;color:var(--tdd)">금액</th></tr>
      ${curLogs.map(s=>`<tr style="border-bottom:1px solid var(--g10)"><td style="padding:5px 7px">${s.date}</td><td style="padding:5px 7px">${iById(s.insId)?.name||'-'}</td><td style="padding:5px 7px">${mById(s.memId)?.name||'-'}</td><td style="padding:5px 7px;text-align:right">${s.fee.toLocaleString()}</td></tr>`).join('')}
    </table></div>`;
  }

  h+='<div class="bgap"></div>';
  B.innerHTML=h;
  setTimeout(()=>drawRevCharts(monthData),50);
}

function drawRevCharts(data){
  const labels=data.map(d=>d.label);
  const revs=data.map(d=>d.revenue);
  const counts=data.map(d=>d.count);
  const teal='#2E93A8', tealL='rgba(46,147,168,0.12)';

/* ══════════════════════════════════════
   INSTRUCTOR PAY (instructor view)
══════════════════════════════════════ */
function rPay(B){
  const ins=loggedUser;
  const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const months=getAllMonths(6);

  let h=`<div class="sec">💰 ${ins.name} 강사 급여 내역</div>`;

  // This month summary
  const thisM=getMonthSessions(TY,TM).filter(s=>s.insId===ins.id);
  const gross=thisM.length*ins.hourlyRate;
  const tax=Math.round(gross*ins.taxRate);
  const net=gross-tax;

  h+=`<div class="pay-card" style="border-color:var(--tm)">
    <div class="pay-head"><span class="pay-name">🗓 ${TY}년 ${MN[TM]} 급여</span><span class="pill pt">이번 달</span></div>
    <div class="pay-detail">
      <div class="pay-detail-row"><span>수업 횟수</span><span>${thisM.length}회 (50분/회)</span></div>
      <div class="pay-detail-row"><span>시간당 단가</span><span>${ins.hourlyRate.toLocaleString()}원</span></div>
      <div class="pay-detail-row"><span>세전 급여</span><span>${gross.toLocaleString()}원</span></div>
      <div class="pay-detail-row"><span>원천징수 3.3%</span><span style="color:var(--red)">- ${tax.toLocaleString()}원</span></div>
      <div class="pay-detail-row" style="font-size:13px"><span>💰 이번 달 실지급 예상</span><span style="color:var(--td)">${net.toLocaleString()}원</span></div>
    </div>
  </div>`;

  // Monthly history chart
  const mData=months.map(({y,m})=>{
    const ss=getMonthSessions(y,m).filter(s=>s.insId===ins.id);
    const g=ss.length*ins.hourlyRate;
    return {label:MN[m],gross:g,net:Math.round(g*(1-ins.taxRate)),sessions:ss.length};
  });
  h+=`<div class="chart-wrap"><div class="chart-title">📊 월별 급여 추이 (세후)</div><div class="chart-h"><canvas id="cPay"></canvas></div></div>`;

  // Monthly breakdown
  h+=`<div class="sec">월별 상세 내역</div>`;
  [...months].reverse().forEach(({y,m})=>{
    const ss=getMonthSessions(y,m).filter(s=>s.insId===ins.id);
    if(!ss.length)return;
    const g=ss.length*ins.hourlyRate, t=Math.round(g*ins.taxRate), n=g-t;
    const isThis=y===TY&&m===TM;
    h+=`<div class="pay-card">
      <div class="pay-head"><span class="pay-name">${y}년 ${MN[m]}</span>${isThis?'<span class="pill pt">이번 달</span>':''}</div>
      <div style="font-size:11px;color:var(--g80);line-height:1.7">수업 ${ss.length}회 · 세전 ${g.toLocaleString()}원 · 공제 ${t.toLocaleString()}원</div>
      <div class="pay-total" style="margin-top:7px"><span class="pay-t-lbl">실지급액</span><span class="pay-t-val">${n.toLocaleString()}원</span></div>
    </div>`;
  });

  // Contract link
  h+=`<div style="margin-top:8px"><button class="sbtn cf" style="width:100%;padding:9px;border-radius:var(--rm);font-size:11px" onclick="openInsContract('${ins.id}')">📋 프리랜서 계약서 확인</button></div>`;
  h+='<div class="bgap"></div>';
  B.innerHTML=h;

  setTimeout(()=>{
    const purp='#6B4FBF', purpL='rgba(107,79,191,0.1)';
    const c=document.getElementById('cPay');
    if(c){
      if(activeCharts['cPay'])activeCharts['cPay'].destroy();
      activeCharts['cPay']=new Chart(c,{type:'bar',data:{labels:mData.map(d=>d.label),datasets:[{label:'세후 급여',data:mData.map(d=>d.net),backgroundColor:purpL,borderColor:purp,borderWidth:2,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(107,79,191,.9)',titleFont:{size:10},bodyFont:{size:11,weight:'600'},padding:7}},scales:{x:{grid:{display:false},ticks:{font:{size:9},color:'#8A8A85'}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:9},color:'#8A8A85'},beginAtZero:true}}}});
    }
  },50);
}

// Returns HTML string for payroll (admin view)
function rPayrollHTML(){
  // 강사는 본인 페이롤만, 관리자는 전체
  const prs=role==='ins'?PAYROLL.filter(p=>p.insId===loggedUser.id):PAYROLL;
  const sorted=[...prs].sort((a,b)=>b.year!==a.year?b.year-a.year:b.month-a.month);
  const confirmed=prs.filter(p=>p.insConfirmed&&p.adminConfirmed).length;
  const thisMonth=prs.filter(p=>p.year===TY&&p.month===TM);
  const MN=MN_KR;
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--blk)">${role==='ins'?'내 급여 내역':'급여 관리'}</div>

    </div>
    <button class="pr-btn new" style="flex:none;padding:7px 12px;font-size:11px" onclick="viewPayroll=-1;insSubTab='payroll';render()">+ 새 페이롤</button>
  </div>`;
  if(thisMonth.length){
    const totalNet=thisMonth.reduce((a,p)=>{recomputePR(p);return a+p.netPay;},0);
    h+=`<div style="background:var(--tl);border-radius:var(--rm);padding:10px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;color:var(--td);font-weight:600">${TY}년 ${MN[TM]} 이번 달</span>
      <span style="font-size:13px;font-weight:700;color:var(--td)">${totalNet.toLocaleString()}원 <span style="font-size:10px;font-weight:400;color:var(--g60)">실지급 합계</span></span>
    </div>`;
  }
  if(!sorted.length) return h+`<div class="es"><span class="ei">📋</span><p>아직 페이롤이 없어요</p></div><div class="bgap"></div>`;
  sorted.forEach(pr=>{
    const pi=PAYROLL.indexOf(pr);

    const ins=INSTRUCTORS.find(i=>i.id===pr.insId)||{name:'?'};
    const insC=pr.insConfirmed, admC=pr.adminConfirmed;
    const isAllDone=insC&&admC, isPartial=insC||admC;
    h+=`<div class="pr-card${isAllDone?' confirmed':isPartial?' partial':''}" onclick="viewPayroll=${pi};render()" style="cursor:pointer">

          ${isAllDone?'<span class="pill pgrn" style="font-size:9px">✅ 최종확정</span>':`<div style="display:flex;gap:3px"><span class="pill ${admC?'ppu':'pg'}" style="font-size:9px">${admC?'✅ 관리자':'⬜ 관리자'}</span><span class="pill ${insC?'pt':'pg'}" style="font-size:9px">${insC?'✅ 강사':'⬜ 강사'}</span></div>`}
        </div>
      </div>
    </div>`;
  });
  return h+'<div class="bgap"></div>';
}

function rDMChatHTML(insId){
  if(!DM[insId]) DM[insId]=[];
  const myId = role==='admin' ? 'admin' : insId;
  // 내가 받은 메시지(상대방이 보낸) 읽음 처리
  DM[insId].forEach(m=>{ if(m.from!==myId) m.read=true; });
  const otherName = role==='admin' ? (iById(insId)?.name||'강사')+' 강사' : '관리자';
  let h=`<button class="bk" onclick="activeDMInsId=null;insSubTab='dm';render()">← 목록</button>
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
    <div class="av" style="background:var(--tl);color:var(--td);width:32px;height:32px;font-size:11px">${role==='admin'?(iById(insId)?.name[0]||'강'):'🏢'}</div>
    <div style="font-size:13px;font-weight:700;color:var(--blk)">${otherName}</div>
  </div>
  <div class="chat-wrap"><div class="chat-msgs" id="chatMsgs">`;
  if(!DM[insId].length){
    h+=`<div style="text-align:center;padding:28px 0;font-size:11px;color:var(--g60)">아직 대화가 없어요.<br>먼저 메시지를 보내보세요!</div>`;
  } else {
    DM[insId].forEach(msg=>{
      const isMe = msg.from===myId;
      h+=`<div class="cmsg ${isMe?'me':'them'}">
        <div class="cbubble">${msg.text}</div>
        <div class="ctime">${msg.date}</div>
      </div>`;
    });
  }
  h+=`</div>
    <div class="chat-bar">
      <input id="dmInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')sendDMInline('${insId}')">
      <button class="chat-send" onclick="sendDMInline('${insId}')">전송</button>
    </div></div><div class="bgap"></div>`;
  return h;
}

function sendDMInline(insId){
  const el=document.getElementById('dmInput');
  const txt=el?.value?.trim(); if(!txt) return;
  if(!DM[insId]) DM[insId]=[];
  const myId=role==='admin'?'admin':insId;
  const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
  DM[insId].push({id:'dm'+Date.now(),from:myId,text:txt,date:today,read:false});
  el.value='';
  // activeDMInsId 유지한 채로 재렌더 → 채팅창 유지
  insSubTab='dm';
  render();
  setTimeout(()=>{const c=document.getElementById('chatMsgs');if(c)c.scrollTop=c.scrollHeight;},30);
}

  const targets=[{id:'admin',name:'관리자',init:'🏢',bg:'var(--pl)',tc:'var(--purp)'}];
  (loggedUser.insIds||[loggedUser.insId]).forEach(iid=>{
    const ins=iById(iid); if(ins) targets.push({id:ins.id,name:ins.name+' 강사',init:ins.name[0],bg:'var(--tl)',tc:'var(--td)'});
  });

  let h=`<div class="sec">메시지</div>
  <div style="background:var(--tl);border-radius:var(--rm);padding:9px 12px;margin-bottom:12px;font-size:11px;color:var(--td)">
    관리자 또는 담당 강사에게 직접 메시지를 보낼 수 있어요.
  </div>`;

  targets.forEach(t=>{
    const msgs=MEM_MSG[memId]?.filter(m=>m.target===t.id||m.from===t.id)||[];
    const last=msgs[msgs.length-1];
    const unread=msgs.filter(m=>!m.read&&m.from!==memId).length;
    h+=`<div class="dm-item${unread?' unread':''}" onclick="activeMsgTargetId='${t.id}';render()">
      <div class="av" style="background:${t.bg};color:${t.tc}">${t.init}</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;color:var(--blk)">${t.name}</div>
        <div class="dm-preview">${last?last.text:'메시지를 시작해보세요'}</div>
      </div>
      ${unread?`<div class="udot"></div>`:''}
    </div>`;
  });
  B.innerHTML=h+'<div class="bgap"></div>';
}

function rMsgChat(B, targetId){
  const memId=loggedUser.id;
  if(!MEM_MSG[memId]) MEM_MSG[memId]=[];
  // mark read
  MEM_MSG[memId].forEach(m=>{ if(m.from===targetId) m.read=true; });

  const target = targetId==='admin'
    ? {name:'관리자',init:'🏢',bg:'var(--pl)',tc:'var(--purp)'}
    : (()=>{ const i=iById(targetId); return i?{name:i.name+' 강사',init:i.name[0],bg:'var(--tl)',tc:'var(--td)'}:{name:'?',init:'?',bg:'var(--g10)',tc:'var(--g60)'}; })();

  const msgs=(MEM_MSG[memId]||[]).filter(m=>m.target===targetId||m.from===targetId);

  let h=`<button class="bk" onclick="activeMsgTargetId=null;render()">← 메시지 목록</button>
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
    <div class="av" style="background:${target.bg};color:${target.tc}">${target.init}</div>
    <div style="font-size:13px;font-weight:600;color:var(--blk)">${target.name}</div>
  </div>
  <div class="chat-wrap">
    <div class="chat-msgs" id="chatMsgs">`;
  if(!msgs.length){
    h+=`<div style="text-align:center;padding:20px 0;font-size:11px;color:var(--g60)">아직 메시지가 없어요.</div>`;
  } else {
    msgs.forEach(msg=>{
      const isMe=msg.from===memId;
      h+=`<div class="cmsg ${isMe?'me':'them'}"><div class="cbubble">${msg.text}</div><div class="ctime">${msg.date}</div></div>`;
    });
  }
  h+=`</div>
    <div class="chat-bar">
      <input id="msgInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')sendMemMsg('${targetId}')">
      <button class="chat-send" onclick="sendMemMsg('${targetId}')">전송</button>
    </div>
  </div><div class="bgap"></div>`;
  B.innerHTML=h;
  setTimeout(()=>{const el=document.getElementById('chatMsgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function sendMemMsg(targetId){
  const el=document.getElementById('msgInput');
  const txt=el?.value?.trim(); if(!txt) return;
  const memId=loggedUser.id;
  if(!MEM_MSG[memId]) MEM_MSG[memId]=[];
  const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
  MEM_MSG[memId].push({id:'mm'+Date.now(),from:memId,target:targetId,text:txt,date:today,read:false});
  el.value='';
  rMsgChat(getBody(),targetId);
}

function openMemberContract(idx){
  const m=MEMBERS[idx], c=m.contract;
  const left=c.totalSessions-c.usedSessions;
  let priceSection='';
  if(c.type==='annual'){
    const plans=[{r:'10회',tot:'1,500,000',pp:'150,000',svc:'-'},{r:'20회',tot:'2,800,000',pp:'140,000',svc:'서비스 1회'},{r:'30회',tot:'3,900,000',pp:'130,000',svc:'서비스 2회'},{r:'40회',tot:'4,800,000',pp:'120,000',svc:'서비스 3회'},{r:'50회',tot:'5,500,000',pp:'110,000',svc:'서비스 4회'}];

// ── 계약서 사진 업로드 (base64로 저장)
function uploadInsPhoto(insId, from){
  const ins=INSTRUCTORS.find(i=>i.id===insId); if(!ins) return;
  if(!ins.files) ins.files=[];

  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.multiple=true;
  input.capture='environment'; // 카메라 바로 열기 (모바일)
  input.style.display='none';
  document.body.appendChild(input);

  input.onchange=function(){
    const files=Array.from(input.files);
    if(!files.length){ document.body.removeChild(input); return; }
    const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
    let done=0;
    files.forEach(file=>{
      const reader=new FileReader();
      reader.onload=function(e){
        const sizeKB=file.size/1024;
        const sizeTxt=sizeKB>=1024?`${(sizeKB/1024).toFixed(1)}MB`:`${Math.round(sizeKB)}KB`;
        ins.files.unshift({
          name:file.name||`계약서사진_${today}.jpg`,
          type:'img',
          date:today,
          size:sizeTxt,
          from,
          dataUrl:e.target.result, // base64 이미지 저장
        });
        done++;
        if(done===files.length){ saveAll(); render(); }
      };
      reader.readAsDataURL(file);
    });
    document.body.removeChild(input);
  };
  input.click();
}

function uploadInsFile(insId, from){
  const ins=INSTRUCTORS.find(i=>i.id===insId);
  if(!ins) return;
  if(!ins.files) ins.files=[];

  // 실제 파일 선택창 열기
  const input=document.createElement('input');
  input.type='file';
  input.accept='.pdf,.doc,.docx,.xlsx,.xls,.hwp,.jpg,.jpeg,.png,.gif';
  input.multiple=true;
  input.style.display='none';
  document.body.appendChild(input);

  input.onchange=function(){
    const files=Array.from(input.files);
    if(!files.length){ document.body.removeChild(input); return; }
    const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
    files.forEach(file=>{
      const sizeKB=file.size/1024;
      const sizeTxt=sizeKB>=1024?`${(sizeKB/1024).toFixed(1)}MB`:`${Math.round(sizeKB)}KB`;
      const ext=file.name.split('.').pop().toLowerCase();
      ins.files.unshift({
        name:file.name,
        type:ext,
        date:today,
        size:sizeTxt,
        from,
        _file:file  // 실제 File 객체 보관 (미리보기용)
      });
    });
    document.body.removeChild(input);
    render();
  };
  input.click();
}

function deleteInsFile(insId, fi){
  const ins=INSTRUCTORS.find(i=>i.id===insId);
  if(!ins||!ins.files) return;
  if(!confirm(`"${ins.files[fi].name}" 파일을 삭제하시겠습니까?`)) return;
  ins.files.splice(fi,1);
  render();
}

/* ── PIN CHANGE ── */
function openPwdChange(target){
  _pwdTarget=target; _pwdStep=0; _pwdOld=''; _pwdNew='';
  document.getElementById('MT').textContent='비밀번호 변경';
  document.getElementById('MA').innerHTML=`<button class="mcc" onclick="closeModal()">취소</button>`;
  renderPinChange();
  document.getElementById('OV').classList.add('open');
}
function renderPinChange(){
  const hints=['현재 비밀번호 입력','새 비밀번호 입력 (4자리)','새 비밀번호 확인'];
  const entry=_pwdStep===0?_pwdOld:_pwdNew;
  document.getElementById('MB').innerHTML=`<div class="pcw">
    <div class="pc-hint">${hints[_pwdStep]||hints[1]}</div>
    <div class="mpd" id="mpd">${[0,1,2,3].map(i=>`<div class="mpdot${i<entry.length?' on':''}"></div>`).join('')}</div>
    <div class="pc-err" id="pcErr"></div>
    <div class="mpp">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="mppb" onclick="pcPress('${n}')">${n}</button>`).join('')}
      <div class="mppb emp"></div>
      <button class="mppb" onclick="pcPress('0')">0</button>
      <button class="mppb del" onclick="pcDel()">⌫</button>
    </div>
  </div>`;
}
function pcPress(v){
  if(_pwdStep===0){
    if(_pwdOld.length>=4)return;
    _pwdOld+=v;
    updMPD(_pwdOld.length);
    if(_pwdOld.length===4){
      const correct=_pwdTarget==='admin'?ADMIN_PWD:loggedUser.pwd;
      if(_pwdOld!==correct){
        document.getElementById('pcErr').textContent='현재 비밀번호가 틀렸어요';
        setTimeout(()=>{ _pwdOld=''; _pwdStep=0; renderPinChange(); },700);
      } else { _pwdStep=1; _pwdNew=''; setTimeout(renderPinChange,100); }
    }
  } else if(_pwdStep===1){
    if(_pwdNew.length>=4)return;
    _pwdNew+=v;
    updMPD(_pwdNew.length);
    if(_pwdNew.length===4){ _pwdStep=2; const tmp=_pwdNew; _pwdNew=''; setTimeout(()=>{ _pwdNew=tmp; openConfirmStep(tmp); },100); }
  }
}
function openConfirmStep(first){
  document.getElementById('MB').innerHTML=`<div class="pcw">
    <div class="pc-hint">새 비밀번호 확인</div>
    <div class="mpd" id="mpd2">${[0,1,2,3].map(()=>`<div class="mpdot"></div>`).join('')}</div>
    <div class="pc-err" id="pcErr2"></div>
    <div class="mpp">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="mppb" onclick="pcConfirm('${n}','${first}')">${n}</button>`).join('')}
      <div class="mppb emp"></div>
      <button class="mppb" onclick="pcConfirm('0','${first}')">0</button>
      <button class="mppb del" onclick="pcCDel()">⌫</button>
    </div>
  </div>`;
  _confirmEntry='';
}
function pcConfirm(v,first){
  if(_confirmEntry.length>=4)return;
  _confirmEntry+=v;
  document.querySelectorAll('#mpd2 .mpdot').forEach((d,i)=>d.classList.toggle('on',i<_confirmEntry.length));
  if(_confirmEntry.length===4){
    if(_confirmEntry===first){
      if(_pwdTarget==='admin')ADMIN_PWD=first;
      else loggedUser.pwd=first;
      closeModal();
      alert('✅ 비밀번호가 변경되었습니다!');
    } else {
      document.getElementById('pcErr2').textContent='비밀번호가 일치하지 않아요';
      setTimeout(()=>{ _confirmEntry=''; document.querySelectorAll('#mpd2 .mpdot').forEach(d=>d.classList.remove('on','er')); document.getElementById('pcErr2').textContent=''; },700);
    }
  }
}
function pcCDel(){ if(_confirmEntry.length){_confirmEntry=_confirmEntry.slice(0,-1); document.querySelectorAll('#mpd2 .mpdot').forEach((d,i)=>d.classList.toggle('on',i<_confirmEntry.length));} }
function updMPD(len){ const dots=document.querySelectorAll('#mpd .mpdot'); if(dots)dots.forEach((d,i)=>d.classList.toggle('on',i<len)); }
function pcDel(){
  if(_pwdStep===0&&_pwdOld.length>0){ _pwdOld=_pwdOld.slice(0,-1); updMPD(_pwdOld.length); }
  else if(_pwdStep===1&&_pwdNew.length>0){ _pwdNew=_pwdNew.slice(0,-1); updMPD(_pwdNew.length); }
}

    <button class="htab${vHealthTab==='weekly'?' on':''}" onclick="vHealthTab='weekly';render()">📋 주차기록</button>
    <button class="htab${vHealthTab==='graph'?' on':''}" onclick="vHealthTab='graph';render()">📈 그래프</button>
    <button class="htab${vHealthTab==='daily'?' on':''}" onclick="vHealthTab='daily';render()">🍱 식단·운동</button>
    <button class="htab${vHealthTab==='plan'?' on':''}" onclick="vHealthTab='plan';render()">📅 12주 플랜</button>
    <button class="htab${vHealthTab==='files'?' on':''}" onclick="vHealthTab='files';render()">📁 자료</button>
    <button class="htab${vHealthTab==='ai'?' on':''}" onclick="vHealthTab='ai';render()" style="${vHealthTab==='ai'?'':'border-color:var(--purp);color:var(--purp)'}">🤖 AI분석</button>
  </div>`;
  if(vHealthTab==='calc')h+=hCalc(mi);
  else if(vHealthTab==='weekly')h+=hWeekly(mi,canEdit);
  else if(vHealthTab==='graph')h+=hGraph(mi);
  else if(vHealthTab==='daily')h+=hDaily(mi,canEdit);
  else if(vHealthTab==='plan')h+=hPlan();
  else if(vHealthTab==='ai')h+=hAI(mi);
  else h+=hFiles(mi,canEdit);
  h+='<div class="bgap"></div>';
  B.innerHTML=h;
  if(vHealthTab==='calc')iCalc(mi);
  if(vHealthTab==='graph')setTimeout(()=>drawHCharts(mi),50);
}

// ── AI 분석 실행 (Claude-in-Claude 방식)
async function runAIAnalysis(mi, type){
  if(aiAnalyzing){ alert('이미 분석 중입니다. 잠시 기다려주세요.'); return; }
  const m = MEMBERS[mi];
  if(!m) return;

  aiAnalyzing = true;
  vHealthTab = 'ai';

  // 로딩 상태로 즉시 렌더
  aiAnalysisCache[m.id] = { result: '__loading__', timestamp: '', type };
  render();

  // 데이터 수집
  const weeks    = (m.weeklyRecords||[]).slice(-4);
  const logs     = (m.dailyLogs||[]).slice(-7);
  const health   = (m.healthRecords||[]).slice(-3);
  const sections = (m.sections||[]).length;

  const typeLabels = {
    full:'종합 분석', nutrition:'영양 분석',
    exercise:'운동 분석', hormone:'호르몬 분석', weekly:'주간 리포트'
  };

  const memberData =
    `회원: ${m.name} | 수강권: ${m.contract.plan} | 수업: ${sections}회\n` +
    `최근4주: ${weeks.length?weeks.map((w,i)=>`${i+1}주차-체중${w.weight||'?'}kg-체지방${w.fat||'?'}%-수면${w.sleep||'?'}h-피로${w.fatigue||'?'}/10`).join(', '):'기록없음'}\n` +
    `최근식단: ${logs.length?logs.map(l=>`${l.date}-${l.calories||'?'}kcal-단백${l.protein||'?'}g-컨디션${l.condition||'?'}/10`).join(', '):'기록없음'}\n` +
    `건강기록: ${health.length?health.map(h2=>`${h2.date}-혈압${h2.bp||'?'}-메모:${h2.note||'없음'}`).join(', '):'없음'}`;

  const prompts = {
    full:      `필라테스 회원 종합 건강 분석 (영양·운동·호르몬·인지):\n${memberData}\n\n1.🥗영양상태 2.💪운동효과 3.🔄호르몬·수면 4.🧠동기·인지 5.📋강사조언 6.🎯이번주미션3가지 순서로 분석해주세요.`,
    nutrition: `영양학 분석:\n${memberData}\n\n칼로리적절성·영양소비율·단백질충분성·미량영양소·수분섭취·개선제안3가지를 분석해주세요.`,
    exercise:  `운동생리학 분석:\n${memberData}\n\n수업강도·체성분변화·회복상태·과훈련징후·4주진도제안·강사조정포인트를 분석해주세요.`,
    hormone:   `호르몬·생리학 분석:\n${memberData}\n\n생리사이클연동·코르티솔·수면-성장호르몬·인슐린저항성·에스트로겐·생활조언을 분석해주세요.`,
    weekly:    `주간 리포트 작성:\n${memberData}\n\n이번주성과3가지·개선점2가지·다음주SMART목표·강사체크포인트·응원메시지를 작성해주세요.`,
  };

  const systemP = `당신은 Atelier,Mouv 필라테스 스튜디오 AI 건강 분석 전문가입니다. 영양학·운동생리학·내분비학·인지심리학 기반으로 분석하되, 의료 진단은 하지 않습니다. 강사가 바로 활용할 수 있는 실용적 조언을 한국어로 이모지와 함께 명확하게 제공하세요.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1200,
        system: systemP,
        messages: [{ role: 'user', content: prompts[type]||prompts.full }]
      })
    });

    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error?.message || `API 오류 (${res.status})`);
    }

    const data = await res.json();
    const result = data.content?.[0]?.text || '분석 결과를 가져오지 못했어요.';
    const now = `${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')} ${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2,'0')}`;
    aiAnalysisCache[m.id] = { result, timestamp: now, type: typeLabels[type]||type };

  } catch(err) {
    // CORS 오류 시 데모 모드로 대체
    const isCORS = err.message.includes('fetch') || err.message.includes('network') || err.message.includes('Failed');
    if(isCORS){
      aiAnalysisCache[m.id] = { result: getDemoAnalysis(m, type), timestamp: '데모 분석', type: typeLabels[type]||type };
    } else {
      aiAnalysisCache[m.id] = { result: `❌ 오류: ${err.message}\n\n잠시 후 다시 시도해주세요.`, timestamp: '오류', type: typeLabels[type]||type };
    }
  }

  aiAnalyzing = false;
  render();
}

// ── 데모 분석 (API 연결 전 미리보기)
// ── 인바디 사진 → AI 자동 파싱
function captureInbody(mi, mode){
  const input = document.createElement('input');
  input.type  = 'file';
  input.accept = 'image/*';
  if(mode==='camera') input.capture = 'environment'; // 카메라 직접 열기
  input.style.display = 'none';
  document.body.appendChild(input);

  input.onchange = async function(){
    const file = input.files?.[0];
    if(!file){ document.body.removeChild(input); return; }

    // 결과 영역 로딩 표시
    const resultBox = document.getElementById(`inbodyResult_${mi}`);
    if(resultBox) resultBox.innerHTML = `
      <div class="ai-thinking" style="margin-top:4px">
        <div class="ai-typing"><span></span><span></span><span></span></div>
        <div style="font-size:11px;color:var(--teal);font-weight:600">인바디 수치 분석 중...</div>
      </div>`;

    try {
      // 이미지 → base64 변환
      const base64 = await new Promise((res,rej)=>{
        const reader = new FileReader();
        reader.onload  = ()=> res(reader.result.split(',')[1]);
        reader.onerror = ()=> rej(new Error('이미지 읽기 실패'));
        reader.readAsDataURL(file);
      });

      // Claude API 호출 (이미지 + 텍스트)
      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 600,
          messages:[{
            role:'user',
            content:[
              {
                type:'image',
                source:{ type:'base64', media_type: file.type||'image/jpeg', data: base64 }
              },
              {
                type:'text',
                text:`이 인바디(체성분분석) 결과지 이미지에서 수치를 읽어 아래 JSON 형식으로만 답하세요.
숫자는 소수점 1자리, 없는 항목은 null로 표기.
반드시 JSON만 출력하고 다른 텍스트는 없어야 합니다.

{
  "weight": null,
  "fatPct": null,
  "muscleMass": null,
  "BMI": null,
  "visceralFat": null,
  "bodyWater": null,
  "boneMass": null,
  "RMR": null,
  "memo": "인바디 자동 파싱"
}`
              }
            ]
          }]
        })
      });

      const data = await res.json();
      const text = data.content?.[0]?.text || '';

      // JSON 파싱
      let parsed = {};
      try {
        const clean = text.replace(/```json|```/g,'').trim();
        parsed = JSON.parse(clean);
      } catch(e) {
        throw new Error('수치를 인식하지 못했습니다. 더 선명한 사진으로 다시 시도해주세요.');
      }

      // 주차 기록에 저장
      const m = MEMBERS[mi];
      if(!m.weeklyRecords) m.weeklyRecords = [];
      const today = `${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
      const week  = m.weeklyRecords.length + 1;
      const newRecord = {
        week,
        date: today,
        weight:      parsed.weight      || null,
        fat:         parsed.fatPct      || null,
        fatPct:      parsed.fatPct      || null,
        muscleMass:  parsed.muscleMass  || null,
        BMI:         parsed.BMI         || null,
        visceralFat: parsed.visceralFat || null,
        bodyWater:   parsed.bodyWater   || null,
        boneMass:    parsed.boneMass    || null,
        RMR:         parsed.RMR         || null,
        memo:        '📸 인바디 자동 파싱',
      };
      m.weeklyRecords.push(newRecord);
      saveAll();

      // 결과 표시
      const fields = [
        ['체중',     parsed.weight,      'kg'],
        ['체지방률', parsed.fatPct,       '%'],
        ['근육량',   parsed.muscleMass,   'kg'],
        ['BMI',      parsed.BMI,          ''],
        ['내장지방', parsed.visceralFat,   '레벨'],
        ['기초대사', parsed.RMR,           'kcal'],
      ].filter(([,v])=>v!=null);

      if(resultBox) resultBox.innerHTML = `
        <div style="background:var(--gl);border-radius:var(--rm);padding:10px 12px;margin-top:4px;border:1px solid #A8D4BC">
          <div style="font-size:11px;font-weight:700;color:var(--grn);margin-bottom:8px">✅ 인바디 자동 저장 완료 (${week}주차)</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">
            ${fields.map(([label,val,unit])=>`
            <div style="background:rgba(255,255,255,.7);border-radius:var(--rs);padding:6px;text-align:center">
              <div style="font-size:9px;color:var(--g60)">${label}</div>
              <div style="font-size:13px;font-weight:800;color:var(--grn)">${val}<span style="font-size:9px">${unit}</span></div>
            </div>`).join('')}
          </div>
          <div style="font-size:10px;color:var(--g60);margin-top:8px;text-align:center">
            주차 기록 탭에서 확인하세요
          </div>
        </div>`;

    } catch(err) {
      if(resultBox) resultBox.innerHTML = `
        <div style="background:#FEF0F0;border-radius:var(--rm);padding:10px 12px;border:1px solid var(--red);margin-top:4px;font-size:11px;color:var(--red)">
          ❌ ${err.message}<br>
          <span style="font-size:10px;color:var(--g60)">💡 인바디 결과지가 선명하게 보이도록 촬영하세요</span>
        </div>`;
    }
    document.body.removeChild(input);
  };
  input.click();
}

function iCalc(mi){
  ['cG','cA','cH','cW','cF','cMM','cTW','cTF','cAct','cWk'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>runCalc(mi);});
}
function runCalc(mi){
  const g=document.getElementById('cG')?.value;
  const a=parseFloat(document.getElementById('cA')?.value);
  const h=parseFloat(document.getElementById('cH')?.value);
  const w=parseFloat(document.getElementById('cW')?.value);
  const f=parseFloat(document.getElementById('cF')?.value);
  const tw=parseFloat(document.getElementById('cTW')?.value);
  const tf=parseFloat(document.getElementById('cTF')?.value);
  const ac=document.getElementById('cAct')?.value;
  const wk=parseFloat(document.getElementById('cWk')?.value)||12;
  if(!g||isNaN(a)||isNaN(h)||isNaN(w)||isNaN(f)||isNaN(tw)||isNaN(tf))return;
  // Excel formulas
  const cf=w*f/100, tgf=tw*tf/100, lf=Math.max(0,cf-tgf);
  const tc=lf*7700, wl=lf/wk, dd=tc/(wk*7);
  const RMR=g==='남성'?88.36+13.4*w+4.8*h-5.7*a:447.6+9.2*w+3.1*h-4.3*a;
  const coef={'매우 낮음 (거의 움직이지 않음)':1.2,'낮음 (가벼운 활동)':1.375,'보통 (주 3~5일 운동)':1.55,'높음 (주 6~7일 운동)':1.725,'매우 높음 (하루 2회 이상)':1.9}[ac]||1.55;
  const TDEE=RMR*coef, di=Math.max(1200,TDEE-dd);
  document.getElementById('calcResult').style.display='block';
  document.getElementById('rCF').textContent=`${cf.toFixed(1)} kg`;
  document.getElementById('rTF').textContent=`${tgf.toFixed(1)} kg`;
  document.getElementById('rLF').textContent=`${lf.toFixed(1)} kg`;
  document.getElementById('rTC').textContent=`${Math.round(tc).toLocaleString()} kcal`;
  document.getElementById('rRMR').textContent=`${Math.round(RMR)} kcal`;
  document.getElementById('rTDEE').textContent=`${Math.round(TDEE)} kcal`;
  document.getElementById('rDD').textContent=`${Math.round(dd)} kcal`;
  document.getElementById('rDI').textContent=`${Math.round(di)} kcal`;
  document.getElementById('rCb').textContent=`약 ${Math.round(di*.4/4)}g`;
  document.getElementById('rPr').textContent=`약 ${Math.round(di*.4/4)}g`;
  document.getElementById('rFt').textContent=`약 ${Math.round(di*.2/9)}g`;
  document.getElementById('rWL').textContent=`${wl.toFixed(2)} kg/주`;
  window._lastCalc={weight:w,fatPct:f,targetWeight:tw,targetFatPct:tf,age:a,height:h,gender:g,activity:ac,RMR:Math.round(RMR),TDEE:Math.round(TDEE),muscleMass:parseFloat(document.getElementById('cMM')?.value)||null,weeks:wk};
}
function saveCalc(mi){
  const c=window._lastCalc; if(!c)return;
  if(!MEMBERS[mi].weeklyRecords)MEMBERS[mi].weeklyRecords=[];

function simUpload(mi){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.pdf,.doc,.docx,.xlsx,.xls,.hwp,.jpg,.jpeg,.png,.gif';
  input.multiple=true;
  input.style.display='none';
  document.body.appendChild(input);

  input.onchange=function(){
    const files=Array.from(input.files);
    if(!files.length){ document.body.removeChild(input); return; }
    const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
    if(!MEMBERS[mi].files) MEMBERS[mi].files=[];
    files.forEach(file=>{
      const sizeKB=file.size/1024;
      const sizeTxt=sizeKB>=1024?`${(sizeKB/1024).toFixed(1)}MB`:`${Math.round(sizeKB)}KB`;
      const ext=file.name.split('.').pop().toLowerCase();
      MEMBERS[mi].files.unshift({
        name:file.name,
        type:ext,
        date:today,
        size:sizeTxt,
        _file:file
      });
    });
    document.body.removeChild(input);
    render();
  };
  input.click();
}
function remFile(mi,fi){MEMBERS[mi].files.splice(fi,1);render();}

   PAYROLL — 강사도 수정/추가 가능, 일정 자동 연동
══════════════════════════════════════ */
function recomputePR(pr){
  const ins=INSTRUCTORS.find(i=>i.id===pr.insId)||{hourlyRate:35000,taxRate:0.033};
  pr.grossPay=pr.sessions.reduce((a,s)=>a+(s.fee||ins.hourlyRate),0);
  pr.taxAmount=Math.round(pr.grossPay*ins.taxRate);
  pr.netPay=pr.grossPay-pr.taxAmount;
}

// 일정 추가 시 자동 페이롤 동기화
function syncPayrollFromSlot(insId,dateKey,memId,type){
  if(!insId||!memId) return;
  const parts=dateKey.split('-');
  if(parts.length!==3) return;
  const y=parseInt(parts[0]),m=parseInt(parts[1]),d=parseInt(parts[2]);
  const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const ins=INSTRUCTORS.find(i=>i.id===insId)||{hourlyRate:35000};

  // ── 페이롤 자동 반영
  let pr=PAYROLL.find(p=>p.insId===insId&&p.year===y&&p.month===m);
  if(!pr){
    pr={id:'pr'+Date.now(),year:y,month:m,insId,sessions:[],grossPay:0,taxAmount:0,netPay:0,insConfirmed:false,adminConfirmed:false,note:'자동생성',insNote:''};
    PAYROLL.push(pr);
  }
  if(pr.adminConfirmed||pr.insConfirmed) return;
  if(!pr.sessions.find(s=>s.date===dateStr&&s.memId===memId)){
    pr.sessions.push({date:dateStr,memId,type:type||'필라테스 1:1',minutes:50,fee:ins.hourlyRate});
    recomputePR(pr);
  }

  // ── 회원 수업 횟수 자동 증가
  const mem=MEMBERS.find(mem=>mem.id===memId);
  if(mem){
    const todayKey=`${TY}-${TM}-${TD}`;
    // 이미 반영된 날짜면 스킵
    if(!mem._syncedDates) mem._syncedDates=[];
    const syncKey=`${dateKey}|${insId}`;
    if(!mem._syncedDates.includes(syncKey)){
      mem._syncedDates.push(syncKey);
      if(mem.contract.usedSessions<mem.contract.totalSessions){
        mem.contract.usedSessions++;
      }
    }
  }
  saveAll();
}

// 특정 월 schedData에서 강사 수업 실시간 집계
function getSchedSessions(insId, y, m){
  const seen=new Set(); const result=[];
  const ins=INSTRUCTORS.find(i=>i.id===insId)||{hourlyRate:35000};
  Object.keys(schedData).forEach(key=>{
    const parts=key.split('-'); if(parts.length!==3) return;
    const ky=parseInt(parts[0]),km=parseInt(parts[1]),kd=parseInt(parts[2]);
    if(ky!==y||km!==m) return;
    const dateStr=`${ky}-${String(km+1).padStart(2,'0')}-${String(kd).padStart(2,'0')}`;
    (schedData[key]||[]).forEach(s=>{
      if(s.insId===insId&&s.st==='cf'&&s.memId){
        const t=String(s.t||'00:00'); // ← t가 undefined/숫자인 경우 문자열 변환
        const k=dateStr+'|'+s.memId+'|'+t;
        if(!seen.has(k)){
          seen.add(k);
          result.push({date:dateStr,memId:s.memId,type:s.type||'필라테스 1:1',fee:ins.hourlyRate,t});
        }
      }
    });
  });
  return result.sort((a,b)=>a.date.localeCompare(b.date)||(a.t||'').localeCompare(b.t||''));
}

// 실시간 페이롤을 PAYROLL에 저장
function createLivePayroll(insId,y,m){
  const sessions=getSchedSessions(insId,y,m);
  const existing=PAYROLL.find(p=>p.insId===insId&&p.year===y&&p.month===m);
  if(existing){ viewPayroll=PAYROLL.indexOf(existing); render(); return; }
  const pr={id:'pr'+Date.now(),year:y,month:m,insId,
    sessions:sessions.map(s=>({date:s.date,memId:s.memId,type:s.type,minutes:50,fee:s.fee})),
    grossPay:0,taxAmount:0,netPay:0,workDays:0,offDays:0,insConfirmed:false,adminConfirmed:false,
    note:`${MN_KR[m]}수업 자동정산`,insNote:''};
  recomputePR(pr);
  PAYROLL.push(pr);
  viewPayroll=PAYROLL.length-1;
  render();
}

function updateFsPreview(){
  const preview=document.getElementById('fsPreview');
  const content=document.getElementById('fsPreviewContent');
  if(!preview||!content) return;
  if(!fsSelDays.length||!fsSelTime){ preview.style.display='none'; return; }
  const y=parseInt(document.getElementById('fs_year')?.value||TY);
  const m=parseInt(document.getElementById('fs_month')?.value??TM);
  const memId=document.getElementById('fs_mem')?.value;
  const mem=mById(memId);
  const dayIdxMap={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
  let allDates=[];
  fsSelDays.forEach(day=>{
    const dayIdx=dayIdxMap[day];
    let cur=new Date(y,m,1);
    while(cur.getDay()!==dayIdx) cur.setDate(cur.getDate()+1);
    while(cur.getMonth()===m){
      allDates.push({date:new Date(cur),day});
      cur.setDate(cur.getDate()+7);
    }
  });
  allDates.sort((a,b)=>a.date-b.date);
  content.innerHTML=allDates.map(({date,day})=>{
    const ds=`${date.getMonth()+1}/${date.getDate()}(${day})`;
    return `<span class="session-tag">📅 ${ds} ${fsSelTime}</span>`;
  }).join('')+`<div style="margin-top:8px;font-size:10px;color:var(--td);font-weight:600">총 ${allDates.length}회 · ${mem?.name||'?'}</div>`;
  preview.style.display='block';
}

function submitFixedSched(){
  if(!fsSelDays.length){ alert('요일을 선택해주세요'); return; }
  if(!fsSelTime){ alert('시간을 선택해주세요'); return; }
  const y=parseInt(document.getElementById('fs_year')?.value||TY);
  const m=parseInt(document.getElementById('fs_month')?.value??TM);
  const insId=document.getElementById('fs_ins')?.value;
  const memId=document.getElementById('fs_mem')?.value;
  const type=document.getElementById('fs_type')?.value||'필라테스 1:1';
  const ins=INSTRUCTORS.find(i=>i.id===insId)||{hourlyRate:35000};
  const dayIdxMap={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};
  let addedCount=0;
  fsSelDays.forEach(day=>{
    const dayIdx=dayIdxMap[day];
    let cur=new Date(y,m,1);
    while(cur.getDay()!==dayIdx) cur.setDate(cur.getDate()+1);
    while(cur.getMonth()===m){
      const key=`${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
      if(!schedData[key]) schedData[key]=[];
      if(!schedData[key].find(s=>s.t===fsSelTime&&s.memId===memId&&s.insId===insId)){
        schedData[key].push({t:fsSelTime,memId,insId,type,st:'cf',note:'고정스케줄'});
        schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
        syncPayrollFromSlot(insId,key,memId,type);
        addedCount++;
      }
      cur.setDate(cur.getDate()+7);
    }
  });
  fsSelDays=[]; fsSelTime='';
  viewFixedSched=false;
  schView='month';
  alert(`✅ 고정 스케줄 등록 완료!\n${MN_KR[m]}월 총 ${addedCount}회 일정이 등록됐습니다.\n페이롤에 자동 반영됩니다.`);
  render();
}

function prUpdateSessions(){
  const insId=document.getElementById('np_ins')?.value;
  const year=parseInt(document.getElementById('np_year')?.value||TY);
  const month=parseInt(document.getElementById('np_month')?.value??TM);
  const ins=INSTRUCTORS.find(i=>i.id===insId)||{hourlyRate:35000};
  const seen=new Set();const merged=[];
  Object.keys(schedData).forEach(key=>{
    const parts=key.split('-');
    if(parts.length!==3) return;
    const y=parseInt(parts[0]),m=parseInt(parts[1]),d=parseInt(parts[2]);
    if(y!==year||m!==month) return;
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    (schedData[key]||[]).forEach(s=>{
      if(s.insId===insId&&s.st==='cf'&&s.memId){
        const k=dateStr+'|'+s.memId;
        if(!seen.has(k)){seen.add(k);merged.push({date:dateStr,memId:s.memId,type:s.type||'필라테스 1:1',fee:ins.hourlyRate});}
      }
    });
  });
  SESSIONS.filter(s=>{
    if(s.insId!==insId) return false;
    const d=new Date(s.date.replace(/-/g,'/'));
    return d.getFullYear()===year&&d.getMonth()===month;
  }).forEach(s=>{
    const k=s.date+'|'+s.memId;
    if(!seen.has(k)){seen.add(k);merged.push({date:s.date,memId:s.memId,type:s.type,fee:ins.hourlyRate});}
  });
  prManualRows=merged;prRenderRows();
}

function editWorkDays(pi, type){
  const pr=PAYROLL[pi];
  const isWork=type==='work';
  const cur=isWork?(pr.workDays||0):(pr.offDays||0);
  const label=isWork?'📅 근무일수':'🌙 휴무일수';
  const color=isWork?'var(--teal)':'#E65100';
  document.getElementById('MT').textContent=label+' 수정';
  document.getElementById('MB').innerHTML=`
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:12px;color:var(--g60);margin-bottom:6px">${label}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:14px">
        <button onclick="adjDays(${pi},'${type}',-1)" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--g20);background:none;font-size:22px;cursor:pointer;font-family:var(--font)">−</button>
        <div id="daysVal" style="font-size:40px;font-weight:800;color:${color};min-width:60px;text-align:center">${cur}</div>
        <button onclick="adjDays(${pi},'${type}',1)" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--g20);background:none;font-size:22px;cursor:pointer;font-family:var(--font)">+</button>
      </div>
      <div style="font-size:11px;color:var(--g60);margin-top:8px">일</div>
    </div>
    <div class="fg"><label>직접 입력</label>
      <input class="fi" id="daysInput" type="number" min="0" max="31" value="${cur}" style="text-align:center;font-size:18px;font-weight:700">
    </div>`;
  document.getElementById('MA').innerHTML=`
    <button class="mcc" onclick="closeModal()">취소</button>
    <button class="mcs" onclick="saveDays(${pi},'${type}')">저장</button>`;
  document.getElementById('OV').classList.add('open');
  // 입력창 변경 시 중간 숫자도 업데이트
  setTimeout(()=>{
    const inp=document.getElementById('daysInput');
    if(inp) inp.oninput=function(){ const v=document.getElementById('daysVal'); if(v) v.textContent=this.value||'0'; };
  },50);
}

function adjDays(pi, type, delta){
  const pr=PAYROLL[pi];
  const isWork=type==='work';
  const cur=isWork?(pr.workDays||0):(pr.offDays||0);
  const newVal=Math.max(0,Math.min(31,cur+delta));
  const v=document.getElementById('daysVal');
  const inp=document.getElementById('daysInput');
  if(v) v.textContent=newVal;
  if(inp) inp.value=newVal;
}

function saveDays(pi, type){
  const val=parseInt(document.getElementById('daysInput')?.value)||0;
  if(type==='work') PAYROLL[pi].workDays=val;
  else PAYROLL[pi].offDays=val;
  closeModal();render();
}

/* ══════════════════════════════════════
   DM — 1:1 대화방
══════════════════════════════════════ */
function rDM(B){
  if(activeDMInsId!==null){rDMChat(B,activeDMInsId);return;}
  if(role==='admin'){
    // Admin DM is now inside rIns tab
    insSubTab='dm'; curTab='ins'; render(); return;
  } else {
    activeDMInsId=loggedUser.id;
    rDMChat(B,loggedUser.id);
  }
}

function rDMChat(B,insId){
  const ins=INSTRUCTORS.find(i=>i.id===insId)||{name:'강사'};
  if(!DM[insId])DM[insId]=[];
  DM[insId].forEach(m=>{if(m.from!==(role==='admin'?'admin':insId))m.read=true;});
  const chatTitle=role==='admin'?ins.name+' 강사와 대화':'관리자와 대화';
  const myId=role==='admin'?'admin':insId;
  const backFn=role==='admin'?`activeDMInsId=null;render()`:`activeDMInsId=null;render()`;
  let h=`<button class="bk" onclick="${backFn}">← 대화 목록</button>
  <div style="font-size:12px;font-weight:600;color:var(--blk);margin-bottom:12px">💬 ${chatTitle}</div>
  <div class="chat-wrap"><div class="chat-msgs" id="chatMsgs">`;
  if(!DM[insId].length){
    h+=`<div style="text-align:center;padding:20px 0;font-size:11px;color:var(--g60)">아직 대화가 없어요. 먼저 메시지를 보내보세요!</div>`;
  } else {
    DM[insId].forEach(msg=>{
      const isMe=msg.from===myId;
      h+=`<div class="cmsg ${isMe?'me':'them'}"><div class="cbubble">${msg.text}</div><div class="ctime">${msg.date}</div></div>`;
    });
  }
  h+=`</div><div class="chat-bar">
    <input id="dmInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')sendDM('${insId}')">
    <button class="chat-send" onclick="sendDM('${insId}')">전송</button>
  </div></div><div class="bgap"></div>`;
  B.innerHTML=h;
  setTimeout(()=>{const el=document.getElementById('chatMsgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function sendDM(insId){
  const el=document.getElementById('dmInput');
  const txt=el?.value?.trim();
  if(!txt)return;
  if(!DM[insId])DM[insId]=[];
  const myId=role==='admin'?'admin':insId;
  const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
  DM[insId].push({id:'dm'+Date.now(),from:myId,text:txt,date:today,read:false});
  el.value='';
  rDMChat(getBody(),insId);
}

    h+=`<div style="font-size:11px;font-weight:700;color:var(--blk);margin-bottom:6px">오늘 수업 · ${todayS.length}건</div>`;

  document.getElementById('MA').innerHTML=`<button class="mcc" onclick="closeModal()">취소</button><button class="mcs" onclick="${saveHandler?saveHandler+'()':'closeModal()'}">${saveHandler?'등록':'저장'}</button>`;

}

function saveMem(){
  const name=document.getElementById('am_n')?.value.trim();
  const phone=document.getElementById('am_p')?.value.trim();
  const plan=document.getElementById('am_plan')?.value;
  // 강사가 등록할 때는 본인 id 사용 (hidden input or loggedUser)
  const insId=document.getElementById('am_ins')?.value || (role==='ins'?loggedUser?.id:'') || '';
  const dt=document.getElementById('am_dt')?.value;
  if(!name||!phone){alert('이름과 연락처를 입력해주세요');return;}
  const colors=[['#E8F6F8','#1A6F80'],['#EAF1FB','#1A5FA5'],['#FBF0F4','#993556'],['#EEEDFE','#4341B4'],['#FDF3E3','#8A5A00'],['#E8F5EE','#2E7D52']];
  const ci=MEMBERS.length%colors.length;
  const init=name.slice(0,2).toUpperCase();
  const totalSessions=plan==='월4회'?4:plan==='월8회'?8:plan==='10회권'?10:plan==='20회권'?20:30;
  const joinDt=dt||`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
  MEMBERS.push({
    id:`m${Date.now()}`,name,init,bg:colors[ci][0],tc:colors[ci][1],
    phone,join:joinDt,st:'active',
    insId, insIds:[insId],  // ← insIds 배열도 함께 설정
    contract:{type:totalSessions>9?'annual':'monthly',plan,totalSessions,usedSessions:0,deposit:0,monthlyFee:0},
    legal:{termsAgreed:false,termsDate:'',privacyAgreed:false,privacyDate:'',healthDataAgreed:false,healthDataDate:'',
           refundAgreed:false,refundDate:'',marketingAgreed:false,marketingDate:'',signDate:'',signIp:''},
    sections:[],weeklyRecords:[],dailyLogs:[],healthRecords:[],files:[],
    needsAdminConfirm: role==='ins',
    registeredBy: role==='ins'?(loggedUser?.name||'강사'):'관리자',
    registeredAt: new Date().toLocaleString('ko-KR'),
  });

  saveAll(); // localStorage + Supabase 동시 저장

  if(role==='ins'){
    const notif={
      id:`notif_${Date.now()}`,type:'confirm_request',
      title:`✋ ${loggedUser?.name||'강사'} 강사가 회원 등록을 요청했습니다`,
      body:`회원명: ${name} · 수강권: ${plan} · 등록일: ${joinDt}\n관리자 확인 후 계약서 작성을 진행해주세요.`,
      from:loggedUser?.name||'강사',date:joinDt,read:false,confirmed:false,
    };
    notices.unshift(notif);
    lsSave(LS_KEYS.NOTICES, notices);
    alert(`✅ ${name} 회원이 등록됐습니다.\n담당 회원 목록에서 바로 확인할 수 있어요.\n(관리자 확인 후 계약서 작성 가능)`);
  } else {
    alert(`✅ ${name} 회원이 등록됐습니다.`);
  }
  closeModal(); render();
}
