<!-- Service Worker 등록 -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    const swCode=`
const CACHE='atelier-mouv-v1';
const ASSETS=['/'];
self.addEventListener('install', e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener('activate', e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch', e=>{
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/'))));
});`;
    const blob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl,{scope:'./'})
      .then(()=>console.log('[PWA] Service Worker 등록 완료'))
      .catch(e=>console.log('[PWA] SW 등록 실패 (로컬에서는 정상):', e.message));
  });
}
// iOS 설치 안내 (1회만 표시)
window.addEventListener('load', async ()=>{
  // 1. localStorage에서 즉시 복원 (오프라인 지원)
  try { await loadAll(); } catch(e) { console.warn('[LS] 로드 오류:', e); }

  // 2. Supabase 세션 복구 (비동기 — 이전 로그인 세션 확인)
  if(sb){
    try {
      const { data } = await sb.auth.getSession();
      if(data?.session){
        sbStudioId = data.session.user.email;
        sbOnline = true;
        console.log('[SB] 세션 복구됨:', sbStudioId);
        // 클라우드에서 최신 데이터 동기화
        const synced = await sbLoadAll();
        if(synced){
          await loadAll(); // 클라우드 데이터로 갱신
        }
      }
    } catch(e){ console.warn('[SB] 세션 복구 실패:', e.message); }
  }

  // 3. 클라우드 배지 업데이트
  const badge = document.getElementById('cloudBadge');
  if(badge){
    badge.textContent = sbOnline ? `☁️ ${sbStudioId}` : '📱 로컬 모드';
    badge.style.color  = sbOnline ? 'var(--grn)' : 'var(--g60)';
  }
  const isIOS=/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
  const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  const shown=sessionStorage.getItem('pwa_hint');
  if(isIOS&&!isStandalone&&!shown){
    sessionStorage.setItem('pwa_hint','1');
    setTimeout(()=>{
      const tip=document.createElement('div');
      tip.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;border-radius:12px;padding:11px 16px;font-size:12px;z-index:9999;max-width:300px;text-align:center;line-height:1.5;box-shadow:0 4px 20px rgba(0,0,0,.3)';
      tip.innerHTML='📱 <b>홈 화면에 추가</b>하면 앱처럼 사용할 수 있어요!<br><span style="font-size:10px;opacity:.8">Safari 하단 공유버튼 → 홈 화면에 추가</span>';
      tip.onclick=()=>tip.remove();
      document.body.appendChild(tip);
      setTimeout(()=>tip.remove(),6000);
    },2000);
  }
});
</script>

<style>
:root{
  --teal:#2E93A8;--td:#1E7080;--tdd:#155A6A;
  --tl:#EAF5F8;--tll:#F4FAFB;--tm:#A8D8E2;
  --w:#fff;--g05:#F8F8F7;--g10:#F0F0EE;
  --g20:#E2E2DF;--g40:#C4C4BF;--g60:#8A8A85;
  --g80:#4A4A46;--blk:#1A1A17;
  --red:#D64444;--wb:#FEF3E2;--wt:#8A5A00;
  --grn:#2E7D52;--gl:#E8F5EE;
  --purp:#6B4FBF;--pl:#F0ECFD;
  --font:'Nunito','Noto Sans KR',sans-serif;
  --rs:6px;--rm:10px;--rl:16px;--rxl:22px;
  --sh:0 8px 32px rgba(46,147,168,.18),0 2px 8px rgba(0,0,0,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:#C0DCE5;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 8px;}

/* ── LOGIN ── */
.lw{width:100%;max-width:360px;margin-top:28px;}
.ll{text-align:center;margin-bottom:24px;}
.ln{font-size:39px;font-weight:600;color:var(--tdd);letter-spacing:-.5px;}
.ln span{font-weight:300;}
.lt{font-size:15px;color:var(--teal);letter-spacing:.4px;margin-top:2px;}
.lc{background:var(--w);border-radius:var(--rxl);padding:24px 20px;box-shadow:var(--sh);}
.lt2{font-size:21px;font-weight:600;color:var(--blk);margin-bottom:14px;}
.lr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:16px;}
.lr{padding:16px 5px;border:1.5px solid var(--g20);border-radius:var(--rl);text-align:center;cursor:pointer;transition:all .15s;}
.lr:hover{border-color:var(--tm);background:var(--tll);}
.lr.sel{border-color:var(--teal);background:var(--tl);}

.lr .lrl{font-size:18px;font-weight:700;color:var(--blk);letter-spacing:-.2px;font-family:"Nunito",sans-serif;}

.la{display:none;margin-bottom:14px;}
.la.show{display:block;}
.la-lbl{font-size:15px;font-weight:600;color:var(--g60);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;}
.la-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:3px;}
.la-f{display:flex;flex-direction:column;gap:3px;}
.la-f label{font-size:10px;font-weight:500;color:var(--g60);}
.lai{padding:10px 11px;border:1.5px solid var(--g20);border-radius:var(--rm);font-size:21px;font-family:var(--font);color:var(--blk);background:var(--w);outline:none;width:100%;transition:border-color .15s;letter-spacing:1px;text-align:center;}
.lai:focus{border-color:var(--teal);}
.lai.nin{text-align:left;letter-spacing:0;}
.lai.err{border-color:var(--red);background:#fff8f8;}
.la-hint{font-size:15px;color:var(--g60);margin-top:3px;text-align:center;}
.la-err{font-size:16px;color:var(--red);margin-top:5px;display:none;text-align:center;}
.la-err.show{display:block;}
/* PIN pad */
.pd{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.pdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--g40);transition:all .15s;}
.pdot.on{background:var(--teal);border-color:var(--teal);}
.pdot.er{background:var(--red);border-color:var(--red);}
.pp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.ppb{padding:15px;border:1px solid var(--g20);border-radius:var(--rm);background:var(--w);font-size:26px;font-weight:500;cursor:pointer;font-family:var(--font);color:var(--blk);transition:all .15s;text-align:center;}
.ppb:hover{background:var(--tl);border-color:var(--tm);}
.ppb:active{transform:scale(.96);}
.ppb.del{font-size:12px;color:var(--g60);}
.ppb.emp{visibility:hidden;}
.bl{width:100%;padding:14px;background:var(--teal);border:none;border-radius:var(--rm);color:var(--w);font-size:19px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s;}
.bl:hover{background:var(--td);}
.bl:disabled{background:var(--g40);cursor:not-allowed;}

/* ── APP ── */
.app{width:100%;max-width:400px;background:var(--w);border-radius:var(--rxl);overflow:hidden;box-shadow:var(--sh);min-height:820px;display:none;flex-direction:column;}
.app.show{display:flex;}
.hd{background:var(--teal);padding:16px 18px 0;position:relative;overflow:hidden;}
.hd::before{content:'';position:absolute;top:-28px;right:-18px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none;}
.hd-r{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;position:relative;z-index:1;}
.hd-logo .hn{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.4px;}
.hd-logo .hn span{font-weight:300;}
.hd-logo .ht{font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.3px;}
.hd-rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.rbadge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;}
.lout{font-size:13px;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;font-family:var(--font);}
.tabs{display:flex;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:9px 12px 10px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:rgba(255,255,255,.5);border-bottom:2px solid transparent;transition:all .2s;text-align:center;font-family:var(--font);white-space:nowrap;}
.tab.on{color:#fff;border-bottom-color:#fff;}
.bdot{display:inline-flex;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:600;align-items:center;justify-content:center;margin-left:2px;vertical-align:middle;}
.body{flex:1;overflow-y:auto;padding:16px;}

/* ── UTILS ── */
.sec{font-size:13px;font-weight:600;color:var(--g60);letter-spacing:.6px;text-transform:uppercase;margin-bottom:9px;}
.al{background:none;border:none;color:var(--teal);font-size:14px;cursor:pointer;font-family:var(--font);font-weight:500;}
.al.m{color:var(--g60);}
.pill{display:inline-flex;font-size:13px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;align-items:center;}
.pt{background:var(--tl);color:var(--td);}
.pa{background:var(--wb);color:var(--wt);}
.pp2{background:var(--teal);color:#fff;}
.pg{background:var(--g10);color:var(--g80);}
.pgrn{background:var(--gl);color:var(--grn);}
.ppu{background:var(--pl);color:var(--purp);}
.prd{background:#FDECEC;color:#A32020;}
.es{text-align:center;padding:36px 0 24px;color:var(--g60);}
.es .ei{font-size:26px;display:block;margin-bottom:7px;}
.es p{font-size:16px;}
.bgap{height:14px;}
.bk{background:none;border:none;cursor:pointer;color:var(--teal);font-size:14px;font-weight:500;font-family:var(--font);margin-bottom:12px;padding:0;}
.div{height:1px;background:var(--g10);margin:12px 0;}

/* ── CARDS ── */
.card{border:1px solid var(--g20);border-radius:var(--rl);padding:11px 13px;margin-bottom:7px;transition:border-color .15s;}
.card:hover{border-color:var(--tm);}
.card.pin{border-left:3px solid var(--teal);}
.card.click{cursor:pointer;}
.card.click:hover{background:var(--tll);}

/* ── CAL ── */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.mlbl{font-size:17px;font-weight:600;color:var(--blk);}
.mbtn{width:30px;height:30px;border:1px solid var(--g20);border-radius:var(--rs);background:none;cursor:pointer;color:var(--g60);font-size:17px;display:flex;align-items:center;justify-content:center;}
.mbtn:hover{border-color:var(--teal);color:var(--teal);}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px;}
.ch{text-align:center;font-size:12px;font-weight:500;color:var(--g60);padding:3px 0 4px;}
.cd{text-align:center;padding:5px 1px;border-radius:var(--rs);cursor:pointer;font-size:14px;color:var(--blk);position:relative;}
.cd:hover{background:var(--tl);}
.cd.tod{background:var(--tl);color:var(--td);font-weight:600;}
.cd.sel{background:var(--teal)!important;color:#fff!important;font-weight:600;}
.cd.hev::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--teal);}
.cd.sel::after{background:rgba(255,255,255,.65);}

/* ── SLOT ── */
.slot{border:1px solid var(--g20);border-radius:var(--rm);padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:9px;transition:border-color .15s;}
.slot:hover{border-color:var(--tm);}
.slot.bl{background:var(--g05);border-style:dashed;}
.stm{font-size:13px;color:var(--g60);min-width:42px;font-weight:500;}
.si{flex:1;min-width:0;}
.sn{font-size:16px;font-weight:500;color:var(--blk);}
.st2{font-size:13px;color:var(--g60);margin-top:1px;}
.sbtn{font-size:13px;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap;border:1px solid var(--teal);background:none;color:var(--teal);transition:all .15s;}
.sbtn:hover{background:var(--teal);color:#fff;}
.sbtn.cf{background:var(--tl);border-color:var(--tm);color:var(--td);}
.sbtn.ed{border-color:var(--g20);color:var(--g60);}

/* ── REQ ── */
.rcard{border:1px solid var(--g20);border-radius:var(--rl);padding:12px 13px;margin-bottom:8px;}
.rtop{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.rav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.rs{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--tl);color:var(--td);cursor:pointer;border:1px solid var(--tm);transition:all .15s;font-family:var(--font);}
.rs:hover,.rs.pk{background:var(--teal);color:#fff;border-color:var(--teal);}
.bconf{flex:1;padding:7px;background:var(--teal);border:none;border-radius:var(--rm);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
.bdeny{padding:7px 12px;border:1px solid var(--g20);border-radius:var(--rm);background:none;color:var(--g60);font-size:11px;cursor:pointer;font-family:var(--font);}
.bdeny:hover{border-color:var(--red);color:var(--red);}

/* ── MEMBER ── */
.mi{border:1px solid var(--g20);border-radius:var(--rl);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .15s;}
.mi:hover{border-color:var(--tm);background:var(--tll);}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.dh2{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.dav{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}
.dn2{font-size:20px;font-weight:700;color:var(--blk);}
.dp{font-size:14px;color:var(--g60);margin-top:1px;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.ib{background:var(--g05);border-radius:var(--rm);padding:9px 11px;}
.ibl{font-size:12px;color:var(--g60);margin-bottom:2px;font-weight:500;}
.ibv{font-size:16px;font-weight:600;color:var(--blk);}
.ibv.w{color:var(--wt);}
.ibv.g{color:var(--td);}
.pbw{margin-bottom:12px;}
.pbl{display:flex;justify-content:space-between;margin-bottom:4px;}
.pb{height:6px;background:var(--g20);border-radius:3px;overflow:hidden;}
.pbf{height:100%;background:var(--teal);border-radius:3px;transition:width .4s;}

/* ── REVENUE ── */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.stat-box{background:var(--g05);border-radius:var(--rm);padding:11px 12px;}
.stat-lbl{font-size:9px;color:var(--g60);margin-bottom:3px;font-weight:500;}
.stat-val{font-size:16px;font-weight:700;color:var(--blk);}
.stat-val.teal{color:var(--td);}
.stat-val.grn{color:var(--grn);}
.stat-val.pur{color:var(--purp);}
.stat-val.red{color:var(--red);}
.stat-sub{font-size:9px;color:var(--g60);margin-top:2px;}
.chart-wrap{background:var(--w);border:1px solid var(--g20);border-radius:var(--rl);padding:12px;margin-bottom:10px;}
.chart-title{font-size:11px;font-weight:600;color:var(--blk);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.chart-h{position:relative;height:150px;}
.month-sw{display:flex;gap:4px;}
.msw{padding:3px 8px;border:1px solid var(--g20);border-radius:20px;font-size:9px;cursor:pointer;font-family:var(--font);background:none;color:var(--g60);transition:all .15s;}
.msw.on{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ── PAY ── */
.pay-card{border:1px solid var(--g20);border-radius:var(--rl);padding:12px 13px;margin-bottom:8px;}
.pay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.pay-name{font-size:13px;font-weight:600;color:var(--blk);}
.pay-detail{font-size:11px;color:var(--g80);background:var(--g05);border-radius:var(--rm);padding:8px 10px;margin-bottom:8px;}
.pay-detail-row{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px;}
.pay-detail-row:last-child{margin-bottom:0;font-weight:600;padding-top:5px;border-top:1px solid var(--g20);}
.pay-total{display:flex;justify-content:space-between;align-items:center;background:var(--tl);border-radius:var(--rm);padding:10px 12px;}
.pay-t-lbl{font-size:11px;color:var(--td);}
.pay-t-val{font-size:16px;font-weight:700;color:var(--td);}

/* ── REG FORM ── */
.reg-section{background:var(--g05);border-radius:var(--rl);padding:13px;margin-bottom:10px;}
.reg-title{font-size:11px;font-weight:600;color:var(--td);margin-bottom:10px;}
.fg{margin-bottom:8px;}
.fg label{font-size:10px;font-weight:500;color:var(--g60);display:block;margin-bottom:3px;}
.fi{width:100%;padding:7px 10px;border:1px solid var(--g20);border-radius:var(--rm);font-size:12px;background:var(--w);color:var(--blk);font-family:var(--font);}
.fi:focus{outline:none;border-color:var(--teal);}
.fta{width:100%;padding:7px 10px;border:1px solid var(--g20);border-radius:var(--rm);font-size:12px;height:60px;resize:none;background:var(--w);color:var(--blk);font-family:var(--font);}
.fi2r{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.reg-list{margin-top:4px;}
.reg-item{border:1px solid var(--g20);border-radius:var(--rm);padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:9px;}
.ri-info{flex:1;}
.ri-name{font-size:16px;font-weight:500;color:var(--blk);}
.ri-sub{font-size:13px;color:var(--g60);margin-top:1px;}

/* ── CONTRACT ── */
.ctv{font-size:12px;color:var(--g80);line-height:1.8;}
.ctv h2{font-size:15px;font-weight:700;color:var(--blk);text-align:center;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--teal);}
.ctv .ch2{font-size:12px;font-weight:700;color:var(--blk);margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--g20);}
.ctv .cfl{display:flex;gap:8px;margin-bottom:8px;}
.ctv .cfl-lbl{font-size:10px;font-weight:600;color:var(--g60);min-width:70px;flex-shrink:0;}
.ctv .cfl-val{flex:1;border-bottom:1px solid var(--g40);padding-bottom:2px;font-size:12px;color:var(--blk);}
.ctv .cbox{background:var(--g05);border-radius:var(--rm);padding:11px 13px;margin:10px 0;}
.ctv .cbox p{margin-bottom:5px;font-size:11px;}
.ctv .cbox p:last-child{margin-bottom:0;}
.ctv .ptable{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px;}
.ctv .ptable th{background:var(--tl);color:var(--tdd);padding:5px 7px;text-align:center;font-weight:600;}
.ctv .ptable td{padding:5px 7px;text-align:center;border-bottom:1px solid var(--g20);}
.ctv .ptable td.lft{text-align:left;}
.ctv .sign-row{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--g20);}
.ctv .sign-box{text-align:center;}
.ctv .sign-box .sl{font-size:10px;color:var(--g60);margin-bottom:22px;}
.ctv .sign-box .sv{border-bottom:1px solid var(--blk);min-width:90px;font-size:11px;color:var(--blk);}

/* ── SETTINGS ── */
.si-item{border:1px solid var(--g20);border-radius:var(--rl);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .15s;}
.si-item:hover{border-color:var(--tm);background:var(--tll);}
.si-lbl{font-size:16px;font-weight:500;color:var(--blk);}
.si-sub{font-size:13px;color:var(--g60);margin-top:1px;}

/* ── PAYROLL ── */
.pr-card{border:2px solid var(--g20);border-radius:var(--rl);margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
.pr-card.confirmed{border-color:var(--grn);}
.pr-card.partial{border-color:var(--teal);}
.pr-header{background:var(--g05);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g20);}
.pr-header.confirmed{background:var(--gl);}
.pr-title{font-size:17px;font-weight:700;color:var(--blk);}
.pr-month{font-size:13px;color:var(--g60);margin-top:2px;}
.pr-body{padding:13px 14px;}
/* confirm status bar */
.pr-confirm-bar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.pr-confirm-box{border-radius:var(--rm);padding:10px 11px;text-align:center;border:1.5px solid var(--g20);}
.pr-confirm-box.done{border-color:var(--grn);background:var(--gl);}
.pr-confirm-box.pending{border-color:var(--g20);background:var(--g05);}
.pr-confirm-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.pr-confirm-box.done .pr-confirm-label{color:var(--grn);}
.pr-confirm-box.pending .pr-confirm-label{color:var(--g60);}
.pr-confirm-icon{font-size:18px;display:block;margin-bottom:2px;}
.pr-confirm-name{font-size:10px;font-weight:600;color:var(--blk);}
.pr-confirm-date{font-size:9px;color:var(--g60);margin-top:1px;}
/* summary numbers */
.pr-summary{background:var(--tl);border-radius:var(--rm);padding:11px 13px;margin-bottom:10px;}
.pr-summary-row{display:flex;justify-content:space-between;font-size:11px;color:var(--g80);margin-bottom:4px;}
.pr-summary-row.gross{color:var(--blk);}
.pr-summary-row.tax{color:var(--red);}
.pr-summary-row.net{border-top:1.5px solid var(--tm);margin-top:6px;padding-top:7px;font-size:14px;font-weight:700;color:var(--td);}
/* session log */
.pr-log{border:1px solid var(--g10);border-radius:var(--rm);overflow:hidden;margin-bottom:10px;}
.pr-log-head{background:var(--tl);padding:6px 10px;font-size:10px;font-weight:600;color:var(--tdd);display:flex;justify-content:space-between;}
.pr-log-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;padding:6px 10px;font-size:10px;color:var(--g80);border-bottom:1px solid var(--g10);align-items:center;}
.pr-log-row:last-child{border-bottom:none;}
.pr-log-row.header{background:var(--g05);font-weight:600;color:var(--g60);}
/* action buttons */
.pr-actions{display:flex;gap:6px;}
.pr-btn{flex:1;padding:9px 8px;border-radius:var(--rm);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);text-align:center;transition:all .15s;border:1.5px solid;}
.pr-btn.new{background:var(--teal);border-color:var(--teal);color:#fff;}
.pr-btn.new:hover{background:var(--td);}
.pr-btn.edit{background:none;border-color:var(--g20);color:var(--g80);}
.pr-btn.edit:hover{border-color:var(--teal);color:var(--teal);}
.pr-btn.confirm-adm{background:none;border-color:var(--purp);color:var(--purp);}
.pr-btn.confirm-adm.on{background:var(--purp);color:#fff;}
.pr-btn.confirm-ins{background:none;border-color:var(--teal);color:var(--teal);}
.pr-btn.confirm-ins.on{background:var(--teal);color:#fff;}
.pr-btn.confirmed-all{background:var(--grn);border-color:var(--grn);color:#fff;cursor:default;}
/* note areas */
.pr-note{background:var(--g05);border-radius:var(--rs);padding:7px 10px;font-size:10px;line-height:1.6;margin-bottom:6px;}
.pr-note .nl{font-weight:600;color:var(--g60);margin-right:4px;}
.pr-note.ins-note{background:var(--tl);}
.pr-note .nl.ins{color:var(--td);}
/* new payroll form */
.pr-new-form{background:var(--tll);border:1.5px dashed var(--tm);border-radius:var(--rl);padding:14px;margin-bottom:12px;}
.pr-new-title{font-size:12px;font-weight:600;color:var(--td);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
/* ── INSTRUCTOR NOTICE ── */
.incard{border:1px solid var(--g20);border-radius:var(--rl);padding:12px 13px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.incard:hover{border-color:var(--tm);background:var(--tll);}
.incard.pin{border-left:3px solid var(--purp);}
.comment-wrap{margin-top:12px;border-top:1px solid var(--g10);padding-top:10px;}
.comment{display:flex;gap:7px;margin-bottom:8px;align-items:flex-start;}
.comment-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;flex-shrink:0;margin-top:1px;}
.comment-bubble{background:var(--g05);border-radius:0 var(--rm) var(--rm) var(--rm);padding:7px 10px;font-size:11px;color:var(--g80);line-height:1.5;flex:1;}
.comment-bubble.adm{background:var(--pl);border-radius:var(--rm) 0 var(--rm) var(--rm);}
.cm-meta{font-size:9px;color:var(--g60);margin-bottom:2px;font-weight:500;}
.comment-bar{display:flex;gap:6px;margin-top:8px;}
.comment-bar input{flex:1;padding:7px 10px;border:1px solid var(--g20);border-radius:var(--rm);font-size:12px;font-family:var(--font);color:var(--blk);background:var(--w);}
.comment-bar input:focus{outline:none;border-color:var(--teal);}
.comment-send{padding:7px 12px;background:var(--teal);border:none;border-radius:var(--rm);color:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);}
/* ── DM CHAT ── */
.dm-item{border:1px solid var(--g20);border-radius:var(--rl);padding:10px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.dm-item:hover{border-color:var(--tm);background:var(--tll);}
.dm-item.unread{border-color:var(--teal);}
.dm-preview{font-size:11px;color:var(--g60);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.udot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:auto;}
.chat-wrap{display:flex;flex-direction:column;min-height:400px;}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 0;display:flex;flex-direction:column;gap:7px;max-height:380px;}
.cmsg{display:flex;flex-direction:column;max-width:80%;}
.cmsg.me{align-self:flex-end;align-items:flex-end;}
.cmsg.them{align-self:flex-start;align-items:flex-start;}
.cbubble{padding:8px 12px;border-radius:16px;font-size:12px;line-height:1.5;color:var(--blk);}
.cmsg.me .cbubble{background:var(--teal);color:#fff;border-radius:16px 16px 4px 16px;}
.cmsg.them .cbubble{background:var(--g10);border-radius:16px 16px 16px 4px;}
.ctime{font-size:9px;color:var(--g60);margin-top:2px;padding:0 4px;}
.chat-bar{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--g10);margin-top:8px;}
.chat-bar input{flex:1;padding:9px 12px;border:1.5px solid var(--g20);border-radius:20px;font-size:12px;font-family:var(--font);color:var(--blk);background:var(--w);}
.chat-bar input:focus{outline:none;border-color:var(--teal);}
.chat-send{padding:9px 14px;background:var(--teal);border:none;border-radius:20px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);}

/* ── SCHEDULE VIEW SWITCHER ── */
.view-sw{display:flex;gap:0;border:1px solid var(--g20);border-radius:var(--rm);overflow:hidden;margin-bottom:12px;}
.vsw{flex:1;padding:6px 4px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--g60);font-family:var(--font);transition:all .15s;text-align:center;}
.vsw.on{background:var(--teal);color:#fff;}
.vsw:not(.on):hover{background:var(--tl);color:var(--td);}
/* week view */
.week-grid{display:grid;grid-template-columns:36px repeat(7,1fr);border:1px solid var(--g20);border-radius:var(--rm);overflow:hidden;margin-bottom:10px;}
.wg-hcell{background:var(--tl);padding:5px 2px;text-align:center;font-size:9px;font-weight:600;color:var(--tdd);border-right:1px solid var(--g20);border-bottom:1px solid var(--g20);}
.wg-hcell:last-child{border-right:none;}
.wg-hcell.today{background:var(--teal);color:#fff;}
.wg-time{background:var(--g05);padding:4px 4px;font-size:9px;color:var(--g60);text-align:right;border-right:1px solid var(--g20);border-bottom:1px solid var(--g10);}
.wg-cell{border-right:1px solid var(--g10);border-bottom:1px solid var(--g10);min-height:28px;position:relative;cursor:pointer;}
.wg-cell:last-child{border-right:none;}
.wg-cell:hover{background:var(--tll);}
.wg-cell.today-col{background:rgba(46,147,168,.04);}
.wg-evt{margin:1px 2px;border-radius:3px;padding:2px 4px;font-size:9px;font-weight:500;line-height:1.3;cursor:pointer;}
.wg-evt.cf{background:var(--teal);color:#fff;}
.wg-evt.bl{background:var(--g20);color:var(--g60);}
/* day view */
.day-timeline{display:grid;grid-template-columns:36px 1fr;border:1px solid var(--g20);border-radius:var(--rm);overflow:hidden;margin-bottom:10px;}
.dt-time{background:var(--g05);padding:5px 4px;font-size:9px;color:var(--g60);text-align:right;border-right:1px solid var(--g20);border-bottom:1px solid var(--g10);}
.dt-cell{border-bottom:1px solid var(--g10);min-height:36px;padding:2px 4px;cursor:pointer;}
.dt-cell:hover{background:var(--tll);}
.dt-evt{border-radius:5px;padding:4px 8px;font-size:10px;font-weight:500;margin-bottom:2px;}
.dt-evt.cf{background:var(--teal);color:#fff;}
.dt-evt.bl{background:var(--g20);color:var(--g60);}
.dt-add{font-size:10px;color:var(--teal);cursor:pointer;padding:2px 4px;}
/* enhanced slot with instructor */
.slot-ins{font-size:9px;color:var(--purp);margin-top:1px;font-weight:500;}
/* enhanced req card */
.req-ins-row{display:flex;align-items:center;gap:7px;margin:8px 0;padding:8px 10px;background:var(--g05);border-radius:var(--rm);}
.req-ins-label{font-size:10px;color:var(--g60);white-space:nowrap;}
.req-custom-time{display:flex;gap:6px;margin-top:6px;align-items:center;}
.req-custom-time input{flex:1;padding:6px 9px;border:1px solid var(--g20);border-radius:var(--rm);font-size:12px;font-family:var(--font);}
.req-custom-time input:focus{outline:none;border-color:var(--teal);}
.rslots-wrap{margin-bottom:6px;}
.rs-selected{background:var(--teal);color:#fff;border-color:var(--teal);}
.rs-custom{background:var(--gl);border-color:var(--grn);color:var(--grn);}

/* ── REVENUE ANALYTICS ── */
.rev-tabs{display:flex;gap:0;border:1px solid var(--g20);border-radius:var(--rm);overflow:hidden;margin-bottom:14px;}
.rev-tab{flex:1;padding:7px 4px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--g60);font-family:var(--font);transition:all .15s;text-align:center;}
.rev-tab.on{background:var(--teal);color:#fff;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.kpi-card{border-radius:var(--rm);padding:11px 12px;}
.kpi-card.teal{background:var(--tl);}
.kpi-card.grn{background:var(--gl);}
.kpi-card.pur{background:var(--pl);}
.kpi-card.warn{background:var(--wb);}
.kpi-card.gray{background:var(--g05);}
.kpi-lbl{font-size:9px;font-weight:600;margin-bottom:4px;letter-spacing:.3px;}
.kpi-card.teal .kpi-lbl{color:var(--td);}
.kpi-card.grn .kpi-lbl{color:var(--grn);}
.kpi-card.pur .kpi-lbl{color:var(--purp);}
.kpi-card.warn .kpi-lbl{color:var(--wt);}
.kpi-card.gray .kpi-lbl{color:var(--g60);}
.kpi-val{font-size:18px;font-weight:700;color:var(--blk);}
.kpi-val.sm{font-size:14px;}
.kpi-sub{font-size:9px;color:var(--g60);margin-top:2px;}
.chart-box{background:var(--w);border:1px solid var(--g20);border-radius:var(--rl);padding:12px;margin-bottom:10px;}
.chart-box-title{font-size:11px;font-weight:700;color:var(--blk);margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.chart-canvas-wrap{position:relative;height:160px;}
.progress-bar-wrap{margin-bottom:8px;}
.progress-bar-header{display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;}
.progress-bar-bg{height:8px;background:var(--g20);border-radius:4px;overflow:hidden;}
.progress-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.exp-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--g10);font-size:11px;}
.exp-item:last-child{border-bottom:none;}
.exp-lbl{display:flex;align-items:center;gap:7px;color:var(--g80);}
.exp-ico{font-size:14px;width:20px;text-align:center;}
.exp-amt{font-weight:600;color:var(--blk);}
.exp-edit{border:none;background:none;color:var(--teal);cursor:pointer;font-size:10px;font-family:var(--font);}
.profit-box{border-radius:var(--rl);padding:13px 14px;margin-top:10px;}
.profit-box.pos{background:linear-gradient(135deg,var(--gl),var(--tl));}
.profit-box.neg{background:var(--wb);}
.profit-label{font-size:10px;font-weight:600;margin-bottom:5px;}
.profit-box.pos .profit-label{color:var(--grn);}
.profit-box.neg .profit-label{color:var(--wt);}
.profit-amount{font-size:24px;font-weight:700;}
.profit-box.pos .profit-amount{color:var(--grn);}
.profit-box.neg .profit-amount{color:var(--red);}
.mem-reg-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--g10);font-size:11px;}
.mem-reg-row:last-child{border-bottom:none;}
.reg-type-badge{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;white-space:nowrap;}
.reg-new{background:#E8F5EE;color:var(--grn);}
.reg-renew{background:var(--tl);color:var(--td);}
.target-input-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.target-input-row label{font-size:10px;color:var(--g60);min-width:60px;}
.target-input-row input{flex:1;padding:6px 9px;border:1px solid var(--g20);border-radius:var(--rm);font-size:12px;font-family:var(--font);color:var(--blk);text-align:right;}
.target-input-row input:focus{outline:none;border-color:var(--teal);}

/* ── FIXED SCHEDULE & PAYROLL TIMELINE ── */
.pr-timeline{display:flex;gap:0;margin-bottom:14px;border-radius:var(--rm);overflow:hidden;border:1px solid var(--g20);}
.pr-tl-tab{flex:1;padding:9px 4px;text-align:center;font-size:10px;font-weight:600;cursor:pointer;border:none;background:none;font-family:var(--font);color:var(--g60);transition:all .15s;border-right:1px solid var(--g20);}
.pr-tl-tab:last-child{border-right:none;}
.pr-tl-tab.on{background:var(--teal);color:#fff;}
.pr-tl-tab.prev.on{background:var(--g60);}
.pr-tl-tab.next.on{background:var(--purp);}
.pr-live-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gl);color:var(--grn);border-radius:20px;padding:2px 8px;font-size:9px;font-weight:600;}
.pr-live-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grn);animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.fs-day-btn{padding:7px 10px;border-radius:var(--rm);font-size:11px;font-weight:600;border:1.5px solid var(--g20);background:none;cursor:pointer;font-family:var(--font);color:var(--g60);transition:all .15s;}
.fs-day-btn.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.fs-time-btn{padding:5px 10px;border-radius:20px;font-size:10px;border:1px solid var(--g20);background:none;cursor:pointer;font-family:var(--font);color:var(--g60);transition:all .15s;}
.fs-time-btn.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.pr-month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--g05);border-radius:var(--rm);padding:8px 12px;margin-bottom:10px;}
.pr-month-label{font-size:13px;font-weight:700;color:var(--blk);}
.pr-month-btn{width:28px;height:28px;border:1px solid var(--g20);border-radius:var(--rs);background:none;cursor:pointer;color:var(--g60);font-size:14px;}
.pr-month-btn:hover{border-color:var(--teal);color:var(--teal);}
.session-tag{display:inline-flex;align-items:center;gap:3px;background:var(--tl);color:var(--td);border-radius:20px;padding:2px 7px;font-size:9px;font-weight:600;margin:2px;}
.pr-summary-box{background:var(--tll);border:1px solid var(--tm);border-radius:var(--rl);padding:12px 14px;margin-bottom:10px;}
.pr-summary-box-title{font-size:10px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}


/* ── SOCIAL LINKS ── */
.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.link-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:13px 8px;border-radius:var(--rl);border:1.5px solid var(--g20);background:var(--w);cursor:pointer;transition:all .2s;text-decoration:none;}
.link-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.link-card.insta{border-color:#E1306C;background:linear-gradient(135deg,#FFF0F5,#FFE4EC);}
.link-card.youtube{border-color:#FF0000;background:linear-gradient(135deg,#FFF5F5,#FFE8E8);}
.link-card.naver{border-color:#03C75A;background:linear-gradient(135deg,#F0FFF5,#E0FFEC);}
.link-card.kakao{border-color:#FEE500;background:linear-gradient(135deg,#FFFEF0,#FFFDE0);}
.link-card.video{border-color:var(--purp);background:var(--pl);}
.link-card.reserve{border-color:var(--teal);background:var(--tl);}
.link-ico{font-size:24px;line-height:1;}

<script>
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
  s.onerror = function(){
    if(typeof window.Chart === 'undefined'){
      window.Chart = function(canvas, cfg){
        this.destroy = function(){};
        if(canvas && canvas.getContext){
          try {
            var ctx = canvas.getContext('2d');
            var lbs = (cfg.data||{}).labels||[];
            var ds = ((cfg.data||{}).datasets||[])[0]||{};
            var vals = ds.data||[];
            var W=canvas.width||300, H=canvas.height||150;
            ctx.clearRect(0,0,W,H);
            ctx.fillStyle='#EAF5F8';ctx.fillRect(0,0,W,H);
            if(vals.length){
              var mx=Math.max(...vals)||1;
              var bw=W/vals.length*0.6, gap=W/vals.length;
              vals.forEach(function(v,i){
                var bh=(v/mx)*(H-30);
                ctx.fillStyle='#2E93A8';
                ctx.fillRect(i*gap+gap*0.2, H-bh-20, bw, bh);
                if(lbs[i]){
                  ctx.fillStyle='#8A8A85';ctx.font='9px sans-serif';
                  ctx.textAlign='center';
                  ctx.fillText(lbs[i], i*gap+gap*0.5, H-6);
                }
              });
            } else {
              ctx.fillStyle='#8A8A85';ctx.font='12px sans-serif';
              ctx.textAlign='center';ctx.fillText('데이터 없음',W/2,H/2);
            }
          } catch(e){}
        }
      };
      window.Chart.register=function(){};
    }
  };
  document.head.appendChild(s);
})();
</script>

  document.querySelector('#MA .mcs').textContent='연결 중...';
  document.querySelector('#MA .mcs').disabled=true;

  // 로그인 시도
  let ok = await sbEmailLogin(email, pwd);
  if(!ok){
    // 계정 없으면 회원가입 후 로그인
    const res = await sbSignUp(email, pwd);
    if(res.ok){
      ok = await sbEmailLogin(email, pwd);

      errEl.textContent='오류: '+res.msg; errEl.style.display='block';
      document.querySelector('#MA .mcs').textContent='☁️ 연결하기';
      document.querySelector('#MA .mcs').disabled=false;
      return;
    }

    saveAll();
    // 배지 즉시 업데이트

// ── 데이터 백업 (완전판 — 모든 데이터 포함)
function exportData(){
  try {
    const now = new Date();
    const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const backup = {
      version: '5.0',
      appName: 'Atelier,Mouv Studio OS',
      exportDate: now.toISOString(),
      exportDateKr: `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`,
      studioName: STUDIO_CONFIG.name,
      // 핵심 데이터
      data: {
        ADMIN_PWD,
        INSTRUCTORS,
        MEMBERS,
        SESSIONS,
        PAYROLL,
        schedData,
        notices,
        INS_NOTICES,
        DM,
        MEM_MSG,
        pendReqs,
        FIXED_EXPENSES,
        REVENUE_TARGETS,
        REG_HISTORY,
        LEGAL_CHECKLIST,
        avail,
        // 운영 모듈
        OPS_TASKS,
        OPS_INVENTORY,
        OPS_SHARE,
        OPS_MEMBER_COND,
        // 설정
        STUDIO_LINKS,
        TAX_CHECKLIST,
        STUDIO_CONFIG,
      }
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${STUDIO_CONFIG.name.replace(/[,\s]/g,'_')}_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // 마지막 백업 일시 저장
    lsSave('am_lastBackup', backup.exportDateKr);
    closeModal();
    alert(`✅ 백업 완료!\n\n파일명: ${a.download}\n\n안전한 곳에 보관해주세요.\n(이메일·구글드라이브·카카오톡 나에게 보내기)`);
  } catch(e) {
    alert('❌ 백업 실패: ' + e.message);
  }
}

// ── 데이터 복원 (완전판)
function importDataPrompt(){
  const input = document.createElement('input');
  input.type  = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  document.body.appendChild(input);

  input.onchange = function(){
    const file = input.files[0];
    if(!file){ document.body.removeChild(input); return; }

    const reader = new FileReader();
    reader.onload = function(e){
      try {
        const backup = JSON.parse(e.target.result);

        // 검증
        if(!backup.data) throw new Error('올바른 백업 파일이 아닙니다. (data 필드 없음)');
        if(!backup.version) throw new Error('버전 정보가 없습니다.');

        const confirmMsg = [
          `📂 백업 파일 정보`,
          `스튜디오: ${backup.studioName||'알 수 없음'}`,
          `백업 날짜: ${backup.exportDateKr||backup.exportDate?.slice(0,10)||'알 수 없음'}`,
          `버전: v${backup.version}`,
          ``,
          `⚠️ 현재 데이터가 백업 데이터로 교체됩니다.`,
          `복원하시겠습니까?`,
        ].join('\n');

        if(!confirm(confirmMsg)){
          document.body.removeChild(input); return;
        }

        const d = backup.data;

        // 모든 데이터 복원
        if(d.ADMIN_PWD)       ADMIN_PWD = d.ADMIN_PWD;
        if(d.INSTRUCTORS)     INSTRUCTORS = d.INSTRUCTORS;
        if(d.MEMBERS)         MEMBERS = d.MEMBERS;
        if(d.SESSIONS)        SESSIONS = d.SESSIONS;
        if(d.PAYROLL)         PAYROLL = d.PAYROLL;
        if(d.schedData)       Object.assign(schedData, d.schedData);
        if(d.notices)         notices.splice(0, notices.length, ...d.notices);
        if(d.INS_NOTICES)     INS_NOTICES = d.INS_NOTICES;
        if(d.DM)              Object.assign(DM, d.DM);
        if(d.MEM_MSG)         Object.assign(MEM_MSG, d.MEM_MSG);
        if(d.pendReqs)        pendReqs = d.pendReqs;
        if(d.FIXED_EXPENSES)  Object.assign(FIXED_EXPENSES, d.FIXED_EXPENSES);
        if(d.REVENUE_TARGETS) Object.assign(REVENUE_TARGETS, d.REVENUE_TARGETS);
        if(d.REG_HISTORY)     REG_HISTORY = d.REG_HISTORY;
        if(d.LEGAL_CHECKLIST) LEGAL_CHECKLIST.forEach((item,i)=>{ if(d.LEGAL_CHECKLIST[i]) item.done=d.LEGAL_CHECKLIST[i].done; });
        if(d.avail)           Object.assign(avail, d.avail);
        if(d.OPS_TASKS&&d.OPS_TASKS.length)     OPS_TASKS = d.OPS_TASKS;
        if(d.OPS_INVENTORY&&d.OPS_INVENTORY.length) OPS_INVENTORY = d.OPS_INVENTORY;
        if(d.OPS_SHARE)       OPS_SHARE = d.OPS_SHARE;
        if(d.OPS_MEMBER_COND) OPS_MEMBER_COND = d.OPS_MEMBER_COND;
        if(d.STUDIO_LINKS)    Object.assign(STUDIO_LINKS, d.STUDIO_LINKS);
        if(d.TAX_CHECKLIST)   Object.assign(TAX_CHECKLIST, d.TAX_CHECKLIST);
        if(d.STUDIO_CONFIG)   Object.assign(STUDIO_CONFIG, d.STUDIO_CONFIG);

        // 전체 저장
        saveAll();
        closeModal();
        alert(`✅ 복원 완료!\n\n${backup.studioName} 데이터가 복원됐습니다.\n회원 ${MEMBERS.length}명 | 강사 ${INSTRUCTORS.length}명`);
        render();

      } catch(err) {
        alert('❌ 복원 실패: ' + err.message + '\n\n올바른 백업 파일(.json)을 선택해주세요.');
      }
      document.body.removeChild(input);
    };
    reader.onerror = function(){ alert('❌ 파일 읽기 실패'); document.body.removeChild(input); };
    reader.readAsText(file, 'UTF-8');
  };
  input.click();
}

// ── 초기화 PIN 입력 처리
function resetPinPress(n){
  if(window.resetPinEntry.length >= 4) return;
  window.resetPinEntry += n;
  // 도트 업데이트
  [0,1,2,3].forEach(i=>{
    const d=document.getElementById('rpd'+i);
    if(d) d.style.background = i<window.resetPinEntry.length ? 'var(--red)' : 'none';
  });
  // 4자리 완성
  if(window.resetPinEntry.length === 4){
    setTimeout(async ()=>{
      if(window.resetPinEntry === ADMIN_PWD){
        closeModal();
        await doResetAllData();
      } else {
        // 틀렸을 때
        const err=document.getElementById('resetPinErr');
        if(err) err.style.display='block';
        [0,1,2,3].forEach(i=>{
          const d=document.getElementById('rpd'+i);
          if(d){ d.style.background='var(--red)'; d.style.opacity='.5'; }
        });
        setTimeout(()=>{
          window.resetPinEntry='';
          [0,1,2,3].forEach(i=>{
            const d=document.getElementById('rpd'+i);
            if(d){ d.style.background='none'; d.style.opacity='1'; }
          });
          if(err) err.style.display='none';
        }, 800);
      }
    }, 100);
  }
}

function resetPinDel(){
  if(!window.resetPinEntry.length) return;
  window.resetPinEntry = window.resetPinEntry.slice(0,-1);
  [0,1,2,3].forEach(i=>{
    const d=document.getElementById('rpd'+i);
    if(d) d.style.background = i<window.resetPinEntry.length ? 'var(--red)' : 'none';
  });
}

async function doResetAllData(){
  try {
    // ── STEP 1. Supabase 클라우드 데이터 삭제
    if(sb && sbStudioId){
      try {
        await sb.from('studio_data')
          .delete()
          .eq('studio_id', sbStudioId);
        console.log('[SB] 클라우드 데이터 삭제 완료');
      } catch(e){ console.warn('[SB] 클라우드 삭제:', e.message); }
    }

    // ── STEP 2. Supabase 세션 로그아웃 (핵심 — 재로드 시 재다운로드 방지)
    if(sb){
      try { await sb.auth.signOut(); } catch(e){}
    }
    sbOnline = false;
    sbStudioId = null;

    // ── STEP 3. localStorage 전체 삭제 (am_ 키 + Supabase 세션 키 포함)
    const allKeys = [];
    for(let i = 0; i < localStorage.length; i++){
      allKeys.push(localStorage.key(i));
    }
    allKeys.forEach(k => {
      if(k) try { localStorage.removeItem(k); } catch(e){}
    });

    // ── STEP 4. sessionStorage도 삭제
    try { sessionStorage.clear(); } catch(e){}

  } catch(e){ console.warn('[Reset] 오류:', e.message); }

  alert('✅ 초기화 완료! 앱을 다시 시작합니다.');
  location.reload();
}

// ── localStorage 용량 확인
function lsUsage(){
  let total = 0;
  Object.values(LS_KEYS).forEach(k=>{
    const v = localStorage.getItem(k);
    if(v) total += v.length;
  });
  const kb = (total / 1024).toFixed(1);
  const pct = ((total / (5 * 1024 * 1024)) * 100).toFixed(1);
  return { kb, pct, bytes: total };
}

    _adminEntry+=v; upd();

      } else {
        document.getElementById('adErr').classList.add('show'); upd();
        setTimeout(()=>{ _adminEntry=''; document.getElementById('adErr').classList.remove('show'); upd(); },800);

    }
  };

async function sbEmailLogin(email, password){

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    sbStudioId = data.user.email;
    sbOnline = true;

// ── Supabase 회원가입 (최초 스튜디오 등록)
async function sbSignUp(email, password){
  if(!sb) return {ok:false, msg:'Supabase 연결 안됨'};

/* ── MONTH VIEW ── */
function rSchMonth(B, h){
  const first=new Date(calY,calM,1).getDay();
  const last=new Date(calY,calM+1,0).getDate();
  h+=`<div class="mnav">
    <button class="mbtn" onclick="pM()">&#8249;</button>
    <span class="mlbl">${calY}년 ${MN_KR[calM]}</span>
    <button class="mbtn" onclick="nM()">&#8250;</button>
  </div><div class="cg">`;
  DH_KR.forEach(d=>h+=`<div class="ch">${d}</div>`);
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=last;d++){
    const key=sk(calY,calM,d);
    let has=false;
    if(schedData[key]) has=role==='mem'?schedData[key].some(s=>s.memId===loggedUser.id&&s.st!=='bl'):schedData[key].some(s=>s.st!=='bl');
    const isT=d===TD&&calM===TM&&calY===TY, isSel=d===selDay;
    h+=`<div class="cd${isT?' tod':''}${isSel?' sel':''}${has?' hev':''}" onclick="pD(${d})">${d}</div>`;
  }
  h+='</div>';
  // day slots below calendar
  if(selDay){
    const key=sk(calY,calM,selDay);
    let rawS=schedData[key]||[];
    let slots=role==='mem'?rawS.filter(s=>s.memId===loggedUser.id||s.st==='open'):rawS;
    h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span class="sec" style="margin-bottom:0">${MN_KR[calM]} ${selDay}일</span>
      ${role!=='mem'?`<div style="display:flex;gap:8px"><button class="al" onclick="openAddSlotModal()">+ 수업 추가</button><button class="al m" onclick="openM('blockSlot')">+ 차단</button></div>`:''}
    </div>`;
    if(!slots.length) h+=`<div class="es" style="padding:24px 0"><span class="ei">📭</span><p>${role==='mem'?'이 날은 내 수업이 없어요':'이 날은 일정이 없어요'}</p></div>`;
    else slots.forEach((s,i)=>{
      const bl=s.st==='bl';
      const mem=s.memId?mById(s.memId):null;
      const ins=s.insId?iById(s.insId):null;
      const nm=bl?(s.note||'차단됨'):role==='mem'?'내 수업':(mem?.name||'미지정');
      const act=role!=='mem'
        ?(bl?`<button class="sbtn ed" onclick="remSlot('${key}',${i})">해제</button>`:`<button class="sbtn cf" onclick="openEditSlotModal('${key}',${i})">수정</button>`)
        :(s.st==='cf'?'<span class="pill pt">예약됨</span>':`<button class="sbtn" onclick="openM('reqSlot')">요청</button>`);
      h+=`<div class="slot${bl?' bl':''}">
        <div class="stm">${s.t}</div>
        <div class="si">
          <div class="sn">${nm}</div>
          ${!bl?`<div class="st2">${s.type}</div>`:''}

        </div>
        ${act}
      </div>`;
    });
  }
  h+='<div class="bgap"></div>';
  B.innerHTML=h;
}

/* ── WEEK VIEW ── */
function rSchWeek(B, prefix){
  const isMem=role==='mem';
  const baseDay=selDay||TD;
  const baseDate=new Date(calY,calM,baseDay);
  const dow=baseDate.getDay();
  const monday=new Date(baseDate); monday.setDate(baseDate.getDate()-(dow===0?6:dow-1));

  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    days.push(d);
  }

  const fmtKey=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const isToday=d=>d.getDate()===TD&&d.getMonth()===TM&&d.getFullYear()===TY;

  const prevMon=new Date(monday); prevMon.setDate(monday.getDate()-7);
  const nextMon=new Date(monday); nextMon.setDate(monday.getDate()+7);
  const wkLabel=`${monday.getMonth()+1}/${monday.getDate()} ~ ${days[6].getMonth()+1}/${days[6].getDate()}`;

  let h=prefix+`<div class="mnav">
    <button class="mbtn" onclick="wkNav(-1)">&#8249;</button>
    <span class="mlbl">${calY}년 ${wkLabel}</span>
    <button class="mbtn" onclick="wkNav(1)">&#8250;</button>
  </div>`;

  h+=`<div class="week-grid">
    <div class="wg-hcell" style="font-size:8px">시간</div>`;
  days.forEach(d=>{
    h+=`<div class="wg-hcell${isToday(d)?' today':''}">${DH_KR[d.getDay()]}<br><b>${d.getDate()}</b></div>`;
  });

  HOURS.forEach(hr=>{
    h+=`<div class="wg-time">${hr}</div>`;
    days.forEach(d=>{
      const key=fmtKey(d);
      // 수강생: 본인 수업만 / 관리자·강사: 전체
      let allSlots=(schedData[key]||[]).filter(s=>s.t===hr);
      const slots=isMem?allSlots.filter(s=>s.memId===loggedUser.id):allSlots;
      const isT=isToday(d);
      h+=`<div class="wg-cell${isT?' today-col':''}" onclick="${isMem?'':` pDFull(${d.getFullYear()},${d.getMonth()},${d.getDate()})`}">`;
      if(!slots.length && isMem){
        h+=``;  // 수강생: 빈 셀 클릭 없음
      }
      slots.forEach(s=>{
        if(s.st==='bl'&&!isMem){
          h+=`<div class="wg-evt bl">${s.note||'차단'}</div>`;
        } else if(s.st!=='bl'){
          const mem=mById(s.memId);
          const ins=s.insId?iById(s.insId):null;
          if(isMem){
            // 수강생: 내 수업 강조 표시
            h+=`<div class="wg-evt cf" style="font-size:9px">
              🧘 ${s.type||'수업'}

            </div>`;
          } else {

/* ── DAY VIEW ── */
function rSchDay(B, prefix){
  const isMem=role==='mem';
  const d=selDay||TD;
  const dow=new Date(calY,calM,d).getDay();
  const dateStr=`${calY}년 ${MN_KR[calM]} ${d}일 (${DH_KR[dow]})`;
  const key=sk(calY,calM,d);
  const daySlots=schedData[key]||[];

  let h=prefix+`<div class="mnav">
    <button class="mbtn" onclick="dayNav(-1)">&#8249;</button>
    <span class="mlbl">${dateStr}</span>
    <button class="mbtn" onclick="dayNav(1)">&#8250;</button>
  </div>`;

  h+=`<div class="day-timeline">`;
  HOURS.forEach(hr=>{
    // 수강생: 본인 수업만 / 관리자·강사: 전체
    const allSlots=daySlots.filter(s=>s.t===hr);
    const slots=isMem?allSlots.filter(s=>s.memId===loggedUser.id):allSlots;

    h+=`<div class="dt-time">${hr}</div>`;
    h+=`<div class="dt-cell"${!isMem?` onclick="quickAddSlot('${key}','${hr}')"`:''}">`;

    if(!slots.length){
      if(isMem){
        // 수강생: 빈 타임슬롯은 조용하게
        h+=`<span style="font-size:10px;color:var(--g20)">—</span>`;
      } else {
        h+=`<span class="dt-add">+ 추가</span>`;
      }
    } else {
      slots.forEach((s,si)=>{
        if(s.st==='bl'&&!isMem){
          h+=`<div class="dt-evt bl">🚫 ${s.note||'차단'} <button class="sbtn ed" style="font-size:9px;padding:2px 7px;margin-left:4px" onclick="event.stopPropagation();remSlot('${key}',${si})">해제</button></div>`;
        } else if(s.st!=='bl'){
          const mem=mById(s.memId);
          const ins=s.insId?iById(s.insId):null;
          if(isMem){
            // 수강생 전용 표시 — 내 수업 카드
            h+=`<div class="dt-evt cf" style="background:var(--tl);border-left:3px solid var(--teal);padding:7px 10px;border-radius:var(--rs)">
              <div style="font-size:12px;font-weight:700;color:var(--td)">🧘 내 수업</div>
              <div style="font-size:11px;color:var(--blk);margin-top:2px">${s.type||'수업'}</div>

              <span class="pill pt" style="margin-top:4px;font-size:9px">예약 확정</span>
            </div>`;
          } else {
            h+=`<div class="dt-evt cf" onclick="event.stopPropagation();openEditSlotModal('${key}',${si})">
              <b>${s.t}</b> ${mem?.name||'?'} · ${s.type}

            </div>`;
          }
        }
      });
    }
    h+=`</div>`;
  });
  h+=`</div>`;

  // 관리자·강사만 추가 버튼
  if(!isMem){
    h+=`<div style="text-align:center;display:flex;gap:12px;justify-content:center"><button class="al" onclick="openAddSlotModal()">+ 수업 추가</button><button class="al m" onclick="openM('blockSlot')">+ 차단</button></div>`;
  }
  h+='<div class="bgap"></div>';
  B.innerHTML=h;
}

/* ── NAV HELPERS ── */
function pM(){if(calM===0){calM=11;calY--;}else calM--;selDay=null;render();}
function nM(){if(calM===11){calM=0;calY++;}else calM++;selDay=null;render();}
function pD(d){selDay=d;render();}
function pDFull(y,m,d){calY=y;calM=m;selDay=d;schView='day';render();}
function wkNav(dir){
  const baseDay=selDay||TD;
  const d=new Date(calY,calM,baseDay);
  d.setDate(d.getDate()+dir*7);
  calY=d.getFullYear();calM=d.getMonth();selDay=d.getDate();render();
}
function dayNav(dir){
  const d=new Date(calY,calM,(selDay||TD)+dir);
  calY=d.getFullYear();calM=d.getMonth();selDay=d.getDate();render();
}
function remSlot(k,i){if(schedData[k])schedData[k].splice(i,1);render();}

function saveAddSlot(){
  const dt=document.getElementById('as_dt')?.value;
  const tm=document.getElementById('as_tm')?.value||'10:00';
  const insId=document.getElementById('as_ins')?.value;
  const memId=document.getElementById('as_mem')?.value;
  const type=document.getElementById('as_type')?.value||'필라테스 1:1';
  const note=document.getElementById('as_note')?.value||'';
  if(!dt){alert('날짜를 선택해주세요');return;}
  const parts=dt.split('-');
  const key=`${parts[0]}-${parseInt(parts[1])-1}-${parseInt(parts[2])}`;
  if(!schedData[key]) schedData[key]=[];
  // Insert sorted by time
  schedData[key].push({t:tm,memId,insId,type,st:'cf',note});
  schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
  // Auto-sync payroll
  if(insId&&memId) syncPayrollFromSlot(insId,key,memId,type);
  calY=parseInt(parts[0]); calM=parseInt(parts[1])-1; selDay=parseInt(parts[2]);
  closeModal(); render();
}

  document.getElementById('MT').textContent=`${t} 수업 추가`;
  document.getElementById('MB').innerHTML=`
    <input type="hidden" id="qa_ins" value="${INSTRUCTORS[0]?.id||''}">
    <div class="fg"><label>회원</label><select class="fi" id="qa_mem">

      <option>필라테스 1:1</option><option>요가 1:1</option><option>무브먼트 1:1</option>
    </select></div>`;
  document.getElementById('MA').innerHTML=`<button class="mcc" onclick="closeModal()">취소</button><button class="mcs" onclick="saveQuickSlot('${key}','${t}')">저장</button>`;
  document.getElementById('OV').classList.add('open');
}

function saveQuickSlot(key, t){
  if(!schedData[key]) schedData[key]=[];
  schedData[key].push({
    t, insId:document.getElementById('qa_ins')?.value,
    memId:document.getElementById('qa_mem')?.value,
    type:document.getElementById('qa_type')?.value||'필라테스 1:1', st:'cf'
  });
  schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
  const _s=schedData[key][schedData[key].length-1];
  if(_s.insId&&_s.memId) syncPayrollFromSlot(_s.insId,key,_s.memId,_s.type);
  closeModal(); render();
}

  const s=schedData[key]?.[i]; if(!s) return;

    <button class="mcs" onclick="saveEditSlot('${key}',${i})">저장</button>`;

function saveEditSlot(key, i){
  if(!schedData[key]?.[i]) return;
  schedData[key][i].t    = document.getElementById('es_tm')?.value||schedData[key][i].t;
  schedData[key][i].type = document.getElementById('es_type')?.value;

  schedData[key][i].memId= document.getElementById('es_mem')?.value;
  schedData[key][i].note = document.getElementById('es_note')?.value||'';
  schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
  closeModal(); render();

function submitMemReq(){
  const type=document.getElementById('nr_type')?.value||'필라테스 1:1';
  const note=document.getElementById('nr_note')?.value?.trim()||'';
  const slots=[];
  for(let i=1;i<=3;i++){
    const d=document.getElementById(`nr_d${i}`)?.value;
    const t=document.getElementById(`nr_t${i}`)?.value;
    if(d&&t){
      const date=new Date(d);
      const dayNames=['일','월','화','수','목','금','토'];
      const dayLabel=`${date.getMonth()+1}/${date.getDate()}(${dayNames[date.getDay()]})`;
      slots.push(`${dayLabel} ${t}`);
    }
  }
  if(!slots.length){alert('1순위 날짜와 시간을 입력해주세요');return;}
  pendReqs.push({
    id:Date.now(), memId:loggedUser.id, type, opts:slots, note,

    customDate:'', customTime:'', insId:loggedUser.insId||''
  });

}

  updateFixedPreview();
}

function toggleTimeBtn(time){
  // 단일 선택
  ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].forEach(t=>{

function updateFixedPreview(){
  const el=document.getElementById('fixedPreview');
  const content=document.getElementById('fixedPreviewContent');
  if(!el||!content) return;
  if(!_selDay||!_selTime){ el.style.display='none'; return; }
  const monthSel=document.getElementById('fr_month')?.value||`${TM}_${TY}`;
  const [m,y]=[parseInt(monthSel.split('_')[0]),parseInt(monthSel.split('_')[1])];
  const countSel=document.getElementById('fr_count')?.value||'4';
  const weeklyCount=parseInt(countSel)/4;
  const monthlyCount=parseInt(countSel);
  content.innerHTML=`
    <b>요일:</b> 매주 ${_selDay}요일 &nbsp;
    <b>시간:</b> ${_selTime} &nbsp;
    <b>기간:</b> ${y}년 ${m+1}월 &nbsp;
    <b>횟수:</b> 월 ${monthlyCount}회 (주 ${weeklyCount}회)`;
  el.style.display='block';
}

function submitFixedReq(){
  if(!_selDay){ alert('고정 요일을 선택해주세요'); return; }
  if(!_selTime){ alert('고정 시간을 선택해주세요'); return; }
  const type=document.getElementById('fr_type')?.value||'필라테스 1:1';
  const note=document.getElementById('fr_note')?.value?.trim()||'';
  const monthSel=document.getElementById('fr_month')?.value||`${TM}_${TY}`;
  const [m,y]=[parseInt(monthSel.split('_')[0]),parseInt(monthSel.split('_')[1])];
  const countSel=parseInt(document.getElementById('fr_count')?.value||'4');

  // 고정타임 opts 생성 (해당 월 해당 요일 날짜 계산)
  const dayIdx=['일','월','화','수','목','금','토'].indexOf(_selDay);
  const dates=[];
  const firstDay=new Date(y,m,1);
  let cur=new Date(firstDay);
  while(cur.getDay()!==dayIdx) cur.setDate(cur.getDate()+1);
  const weeklyN=countSel===4?1:2;
  let addedCount=0;
  while(cur.getMonth()===m&&addedCount<countSel){
    const dl=`${cur.getMonth()+1}/${cur.getDate()}(${_selDay})`;
    dates.push(`${dl} ${_selTime}`);
    addedCount++;
    if(weeklyN===2&&addedCount<countSel){
      // 주 2회면 3~4일 후 추가
      const next=new Date(cur); next.setDate(cur.getDate()+3);
      if(next.getMonth()===m){
        dates.push(`${next.getMonth()+1}/${next.getDate()}(${_selDay}) ${_selTime}`);
        addedCount++;
      }
      cur.setDate(cur.getDate()+7);
    } else {
      cur.setDate(cur.getDate()+7);
    }
  }

  pendReqs.push({
    id:Date.now(), memId:loggedUser.id, type,
    opts:dates.slice(0,3), // 첫 3개를 선택지로
    note:`[고정타임] ${y}년 ${m+1}월 매주 ${_selDay}요일 ${_selTime} 월${countSel}회${note?' / '+note:''}`,
    pk:null, fixed:true, fixedDay:_selDay, fixedTime:_selTime, fixedCount:countSel,
    fixedYear:y, fixedMonth:m,
    customDate:'', customTime:'', insId:loggedUser.insId||''
  });
  const b=document.getElementById('bdot');
  if(b) b.textContent=pendReqs.length;
  _selDay=''; _selTime='';
  memReqView=null;
  alert(`✅ 고정타임 신청이 전송됐어요!\n매주 ${_selDay}요일 ${_selTime} · ${y}년 ${m+1}월 월${countSel}회\n강사님 확인 후 전체 일정이 확정됩니다.`);
  render();
}

function pkR(ri,si){
  pendReqs[ri].pk=si;
  pendReqs[ri].customTime='';
  pendReqs[ri].customDate='';
  render();
}

function cfR(ri){
  const r=pendReqs[ri];
  // Add confirmed slot to schedule
  let dateStr='', timeStr='';
  if(r.customTime&&r.customDate){
    dateStr=r.customDate; timeStr=r.customTime;
  } else if(r.pk!==null){
    // Parse "3/18(화) 10:00" format
    const match=r.opts[r.pk].match(/(\d+):(\d+)/);
    timeStr=match?match[0]:'10:00';
    // Use today's date as fallback
    dateStr=`${TY}-${String(TM+1).padStart(2,'0')}-${String(TD).padStart(2,'0')}`;
  } else return;

  const parts=dateStr.split('-');
  if(parts.length===3){
    const key=`${parts[0]}-${parseInt(parts[1])-1}-${parseInt(parts[2])}`;
    if(!schedData[key]) schedData[key]=[];
    schedData[key].push({
      t:timeStr, memId:r.memId, insId:r.insId||r.memId&&mById(r.memId)?.insId,
      type:r.type, st:'cf', note:''
    });
    schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
  }

  pendReqs.splice(ri,1);
  const b=document.getElementById('bdot');
  if(b) b.textContent=pendReqs.length;
  render();
}

function dnR(ri){

}

// 고정타임 일괄 확정 — 한 달치 일정 전부 schedData에 추가
function cfRFixed(ri){
  const r=pendReqs[ri]; if(!r||!r.fixed) return;
  const insId=r.insId||mById(r.memId)?.insId;
  const y=r.fixedYear||TY, m=r.fixedMonth??TM;
  const dayIdx=['일','월','화','수','목','금','토'].indexOf(r.fixedDay);
  const weeklyN=r.fixedCount===8?2:1;
  // 해당 월 모든 해당 요일 날짜 수집
  let dates=[];
  let cur=new Date(y,m,1);
  while(cur.getDay()!==dayIdx) cur.setDate(cur.getDate()+1);
  let added=0;
  while(cur.getMonth()===m && added<r.fixedCount){
    dates.push(new Date(cur));
    added++;
    if(weeklyN===2 && added<r.fixedCount){
      const next=new Date(cur); next.setDate(cur.getDate()+3);
      if(next.getMonth()===m){ dates.push(new Date(next)); added++; }
    }
    cur.setDate(cur.getDate()+7);
  }
  // schedData에 일괄 추가
  dates.forEach(d=>{
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if(!schedData[key]) schedData[key]=[];
    // 중복 방지
    if(!schedData[key].find(s=>s.t===r.fixedTime&&s.memId===r.memId)){
      schedData[key].push({t:r.fixedTime,memId:r.memId,insId,type:r.type,st:'cf',note:'고정타임'});
      schedData[key].sort((a,b)=>a.t.localeCompare(b.t));
      syncPayrollFromSlot(insId,key,r.memId,r.type);
    }
  });
  pendReqs.splice(ri,1);
  const b=document.getElementById('bdot');
  if(b) b.textContent=pendReqs.length;
  const msg=`✅ 고정타임 확정!\n매주 ${r.fixedDay}요일 ${r.fixedTime}\n${y}년 ${m+1}월 총 ${dates.length}회 일정 등록 완료`;
  alert(msg);
  render();
}

// ── 관리자 회원 등록 확인
function confirmMemberRequest(noticeIdx){
  const n=notices[noticeIdx]; if(!n) return;
  n.confirmed=true;
  n.confirmedBy='관리자';
  n.confirmedAt=new Date().toLocaleString('ko-KR');
  // 해당 회원의 needsAdminConfirm 플래그 해제
  MEMBERS.forEach(m=>{
    if(m.needsAdminConfirm && m.registeredAt && n.body?.includes(m.name)){
      m.needsAdminConfirm=false;
    }
  });
  saveAll();
  render();
  alert('✅ 확인 완료!\n강사에게 다음 로그인 시 반영됩니다.');
}

// ── 링크 열기
function openLink(url){
  if(!url || url.trim()===''){
    alert('링크가 설정되지 않았어요.\n\n공지 → 채널 바로가기 → 연결 버튼을 눌러\nURL을 입력해주세요.');
    return;
  }
  // http:// or https:// 없으면 자동 추가
  const target = url.startsWith('http') ? url : 'https://'+url;
  window.open(target, '_blank');
}

// ── 채널 URL 저장
function saveChannelLink(key){
  const input = document.getElementById('cc_url');
  if(!input){ alert('입력창을 찾을 수 없습니다.'); return; }
  let url = input.value.trim();

  // 유효성 검사
  if(url && !url.startsWith('http') && !url.startsWith('@') && !url.includes('.')){
    alert('올바른 URL을 입력해주세요.\n예: https://instagram.com/계정명');
    input.focus(); return;
  }

  STUDIO_LINKS[key] = url;
  lsSave('am_studioLinks', STUDIO_LINKS);
  closeModal();

  // 성공 피드백
  const labels={instagram:'인스타그램',youtube:'유튜브',naverBlog:'네이버 블로그',naverPlace:'네이버 플레이스',kakaoChat:'카카오 채널'};
  if(url) alert(`✅ ${labels[key]||key} 연결 완료!\n${url}`);
  else alert(`🗑 ${labels[key]||key} 연결이 해제됐습니다.`);
  render();
}

// ── 회원 만료/활성화 토글
function expireMember(i){
  const m=MEMBERS[i];
  if(m.st==='expired'){
    if(!confirm(`${m.name} 회원을 다시 활성화하시겠습니까?`)) return;
    MEMBERS[i].st='active';
    alert(`✅ ${m.name} 회원 활성화 완료`);
  } else {
    if(!confirm(`⚠️ ${m.name} 회원을 만료 처리하시겠습니까?\n잔여 ${m.contract.totalSessions-m.contract.usedSessions}회가 남아있습니다.`)) return;
    MEMBERS[i].st='expired';
    alert(`✅ ${m.name} 회원 만료 처리 완료`);
  }
  saveAll(); vMem=null; render();
}

// ── 회원 삭제 (2단계 확인)
function deleteMember(i){
  const m=MEMBERS[i];
  if(!confirm(`⚠️ "${m.name}" 회원을 완전히 삭제하시겠습니까?\n\n· 수업 기록, 섹션지, 건강 데이터 모두 삭제\n· 이 작업은 되돌릴 수 없습니다.`)) return;
  const input=prompt(`확인을 위해 "${m.name}"을 정확히 입력하세요:`);
  if(input===null) return;
  if(input.trim()!==m.name){ alert('이름이 일치하지 않아 취소됐습니다.'); return; }
  MEMBERS.splice(i,1);
  saveAll(); vMem=null;
  alert(`✅ ${m.name} 회원이 삭제됐습니다.`);
  render();
}

  const plan=document.getElementById('rn_plan')?.value||'';

// ── 서명 캔버스 초기화
function initSignCanvas(){
  const canvas=document.getElementById('signCanvas'); if(!canvas) return;
  const wrap=canvas.parentElement;
  canvas.width=wrap.offsetWidth||300;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1A1A1F';
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  let drawing=false, lastX=0, lastY=0;

  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;
    const t=e.touches?e.touches[0]:e;
    return [(t.clientX-rect.left)*scaleX,(t.clientY-rect.top)*scaleY];
  }

  function start(e){
    e.preventDefault();
    drawing=true;
    [lastX,lastY]=getPos(e);
    const ph=document.getElementById('signPlaceholder');
    if(ph) ph.style.display='none';
  }
  function move(e){
    e.preventDefault();
    if(!drawing) return;
    const [x,y]=getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    [lastX,lastY]=[x,y];
  }
  function end(e){ e.preventDefault(); drawing=false; }

  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end,{passive:false});
}

// ── 서명 캔버스 지우기
function clearSignCanvas(){
  const canvas=document.getElementById('signCanvas'); if(!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
  const ph=document.getElementById('signPlaceholder');
  if(ph) ph.style.display='block';
}

// ── 서명 저장 → 페이롤 자동 확정 연동
function saveMemberSign(mi,si){
  const canvas=document.getElementById('signCanvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  const hasData=pixels.some(p=>p!==0);
  if(!hasData){ alert('서명을 먼저 입력해주세요.\n손가락으로 서명란에 직접 서명해주세요.'); return; }

  const m=MEMBERS[mi]; if(!m) return;
  const s=m.sections[si]; if(!s) return;
  const now=new Date();
  const dateStr=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  s.memberSign={
    data:canvas.toDataURL('image/png'),
    date:dateStr,
    signer:m.name,
  };

  // ── 섹션지 서명 완료 → 해당 수업 페이롤 세션 자동 확정
  if(s.date && s.insId){
    // 섹션지 날짜 형식(YYYY.MM.DD)을 페이롤 년/월로 변환
    const parts=s.date.split('.');
    if(parts.length>=2){
      const sYear=parseInt(parts[0]);
      const sMonth=parseInt(parts[1])-1; // 0-based
      // 해당 강사·월의 페이롤 찾기
      const pr=PAYROLL.find(p=>p.insId===s.insId && p.year===sYear && p.month===sMonth);
      if(pr){
        // 해당 회원의 세션 찾아 확정 표시
        const sess=pr.sessions?.find(ps=>ps.memId===m.id && ps.date===s.date);
        if(sess){
          sess.signed=true;
          sess.signedAt=dateStr;
        }
        // 모든 세션이 서명됐으면 강사 확인 자동 처리
        const allSigned=pr.sessions?.every(ps=>{
          const mem=mById(ps.memId);
          if(!mem) return true;
          const sec=mem.sections?.find(sc=>sc.date===ps.date);
          return sec?.memberSign?.data;
        });
        if(allSigned && pr.sessions?.length>0){
          pr.insConfirmed=true;
          pr.insConfirmedAuto=true;
          pr.insConfirmedAt=dateStr;
        }
      }
    }
  }

  saveAll();
  render();
  alert(`✅ 서명 완료!\n${s.date} 수업 확인됐습니다.`);
}

// ── 서명 삭제 (관리자 전용)
function clearMemberSign(mi,si){
  if(role!=='admin'){
    alert('⚠️ 서명은 한번 작성되면 수정·삭제할 수 없습니다.\n변경이 필요하면 관리자에게 문의해주세요.');
    return;
  }
  if(!confirm('관리자 권한으로 서명을 삭제하시겠습니까?\n삭제 후 회원이 다시 서명할 수 있습니다.')) return;
  const m=MEMBERS[mi]; if(!m) return;
  const s=m.sections[si]; if(!s) return;
  // 관리자 삭제 이력 기록
  s.memberSignDeleted = {
    deletedBy: ADMIN_PWD ? '관리자' : '관리자',
    deletedAt: new Date().toLocaleString('ko-KR'),
    prevSigner: s.memberSign?.signer,
    prevDate:   s.memberSign?.date,
  };
  delete s.memberSign;
  saveAll();
  render();
}

function uploadMemPhoto(mi){
  const m=MEMBERS[mi]; if(!m) return;
  if(!m.files) m.files=[];
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*'; input.multiple=true; input.capture='environment'; input.style.display='none';
  document.body.appendChild(input);
  input.onchange=function(){
    const files=Array.from(input.files); if(!files.length){document.body.removeChild(input);return;}
    const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
    let done=0;
    files.forEach(file=>{
      const reader=new FileReader();
      reader.onload=e=>{
        const kb=file.size/1024;
        m.files.unshift({name:file.name||`계약사진_${today}.jpg`,type:'img',date:today,size:kb>=1024?`${(kb/1024).toFixed(1)}MB`:`${Math.round(kb)}KB`,dataUrl:e.target.result});
        done++; if(done===files.length){saveAll();render();}
      };
      reader.readAsDataURL(file);
    });
    document.body.removeChild(input);
  };
  input.click();
}
function uploadMemFile(mi){
  const m=MEMBERS[mi]; if(!m) return;
  if(!m.files) m.files=[];
  const input=document.createElement('input');
  input.type='file'; input.accept='.pdf,.doc,.docx,.hwp,.jpg,.png'; input.multiple=true; input.style.display='none';
  document.body.appendChild(input);
  input.onchange=function(){
    const files=Array.from(input.files); if(!files.length){document.body.removeChild(input);return;}
    const today=`${TY}.${String(TM+1).padStart(2,'0')}.${String(TD).padStart(2,'0')}`;
    files.forEach(file=>{
      const kb=file.size/1024;
      m.files.unshift({name:file.name,type:file.name.split('.').pop().toLowerCase(),date:today,size:kb>=1024?`${(kb/1024).toFixed(1)}MB`:`${Math.round(kb)}KB`});
    });
    document.body.removeChild(input); saveAll(); render();
  };
  input.click();
}

function getMonthSessions(y,m){
  return SESSIONS.filter(s=>{
    const d=new Date(s.date.replace(/-/g,'/'));
    return d.getFullYear()===y && d.getMonth()===m;
  });
}
function getAllMonths(n){
  const months=[];
  for(let i=n-1;i>=0;i--){
    let m=TM-i, y=TY;
    while(m<0){m+=12;y--;}
    months.push({y,m});
  }
  return months;
}

let analyticsPeriod=3; // 3 | 6 | 12

let legalSubTab='status'; // 'status'|'manual'|'docs'

function getAnalyticsMonths(n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    let m=TM-i, y=TY;
    while(m<0){m+=12;y--;}
    out.push({y,m});
  }
  return out;
}

function getMonthRevenue(y,m){
  // 회원 등록 매출
  const ym=`${y}-${String(m+1).padStart(2,'0')}`;
  const regRev=REG_HISTORY.filter(r=>r.date===ym).reduce((a,r)=>a+r.amount,0);
  return regRev;
}

function getMonthPayroll(y,m){
  const prs=PAYROLL.filter(p=>p.year===y&&p.month===m);
  prs.forEach(p=>recomputePR(p));
  return prs.reduce((a,p)=>a+p.netPay,0);
}

function getTotalFixedExp(){
  return Object.values(FIXED_EXPENSES).reduce((a,e)=>a+e.amount,0);
}

function rAnalytics(B){
  const MN=MN_KR;
  const months=getAnalyticsMonths(analyticsPeriod);

  // Period revenue data
  const mData=months.map(({y,m})=>{
    const rev=getMonthRevenue(y,m);
    const pay=getMonthPayroll(y,m);
    const fixed=getTotalFixedExp();
    return {label:`${m+1}월`,y,m,rev,pay,fixed,profit:rev-pay-fixed};
  });

  // This month stats
  const thisRev=getMonthRevenue(TY,TM);
  const thisPay=getMonthPayroll(TY,TM);
  const thisFixed=getTotalFixedExp();
  const thisProfit=thisRev-thisPay-thisFixed;
  const totalRev=mData.reduce((a,d)=>a+d.rev,0);

  // Member stats
  const activeM=MEMBERS.filter(m=>m.st==='active').length;
  const expireM=MEMBERS.filter(m=>m.st==='expire').length;
  const thisMonthYM=`${TY}-${String(TM+1).padStart(2,'0')}`;
  const newThisMonth=REG_HISTORY.filter(r=>r.date===thisMonthYM&&r.type==='new').length;
  const renewThisMonth=REG_HISTORY.filter(r=>r.date===thisMonthYM&&r.type==='renew').length;

  // Goal progress
  const targetPct=Math.min(100,Math.round(thisRev/REVENUE_TARGETS.monthly*100));

  let h=`
  <!-- 뒤로가기 (운영 탭에서 들어온 경우) -->

    3:[],4:[],

    8:[{type:'yellow',label:'종합소득세 분납 (해당 시)',due:'8월 31일',law:'소득세법',key:'income'}],
    9:[],10:[],
    11:[{type:'yellow',label:'연말 세무 준비',due:'11월 중',law:'종합소득세 대비',key:'annual'}],
    12:[{type:'red',label:'연간 자료 취합',due:'12월 31일',law:'종합소득세 대비',key:'annual'},
        {type:'yellow',label:'세무사 계약 갱신',due:'12월 중',law:'',key:'annual'}],
  };
  const curItems = taxSchedule[thisMonth]||[];
  const allDone = sec => (TAX_CHECKLIST[sec]||[]).every(i=>i.done);
  const doneCnt = sec => (TAX_CHECKLIST[sec]||[]).filter(i=>i.done).length;
  const totCnt  = sec => (TAX_CHECKLIST[sec]||[]).length;

  // 매출·페이롤 데이터 집계
  const revData = [];
  for(let m=0;m<12;m++){
    let total=0;
    MEMBERS.forEach(mem=>{
      (mem.sections||[]).forEach(s=>{
        if(!s.date) return;
        const parts=s.date.split('-');
        if(parts.length<2) return;
        if(parseInt(parts[1])-1===m) total+=(s.fee||0);
      });
    });
    revData.push(total);
  }
  const totalRev = revData.reduce((a,b)=>a+b,0);
  const h1Rev = revData.slice(0,6).reduce((a,b)=>a+b,0);
  const h2Rev = revData.slice(6,12).reduce((a,b)=>a+b,0);
  const estVat1 = Math.round(h2Rev*0.1);
  const estVat2 = Math.round(h1Rev*0.1);
  const confirmedPayroll = PAYROLL.filter(p=>p.adminConfirmed);
  const estInsTax = Math.round(confirmedPayroll.reduce((a,p)=>a+(p.grossPay||0),0)*0.033);
  const estIncome = totalRev - confirmedPayroll.reduce((a,p)=>a+(p.grossPay||0),0);
  const estIncTax = estIncome>0 ? Math.round(estIncome*0.15) : 0;

  let h = `
  <div style="background:linear-gradient(135deg,#BF360C,#E65100);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden">
    <div style="position:absolute;right:-10px;top:-10px;font-size:60px;opacity:.1">🧾</div>
    <div style="font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px">TAX MANAGEMENT</div>
    <div style="font-size:15px;font-weight:800;margin-bottom:6px">${TY}년 ${thisMonth}월 세무 현황</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span style="background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:600">
        ${curItems.length?'⚠️ 이달 '+curItems.length+'건 예정':'✅ 이달 정기 신고 없음'}
      </span>
      <span style="background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:600">
        🔄 매월 10일 원천징수 필수
      </span>
    </div>
  </div>

  <!-- 4개 탭 -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:14px">
    ${[['calendar','📅 일정'],['checklist','✅ 체크'],['docs','📊 자료'],['guide','💡 절세']].map(([t,l])=>{
      const on=taxSubTab===t;
      return `<button onclick="taxSubTab='${t}';render()"
        style="padding:8px 2px;border-radius:var(--rm);border:${on?'2px solid #E65100':'1.5px solid var(--g20)'};
        background:${on?'#E65100':'none'};color:${on?'#fff':'var(--g60)'};
        font-size:10px;font-weight:${on?'700':'600'};cursor:pointer;font-family:var(--font)">${l}</button>`;
    }).join('')}
  </div>`;

  if(taxSubTab==='calendar')   h += rTaxCalendarHTML2(taxSchedule, thisMonth, revData, h1Rev, h2Rev, estVat1, estVat2, estInsTax, estIncTax);
  else if(taxSubTab==='checklist') h += rTaxChecklistHTML2(allDone, doneCnt, totCnt);
  else if(taxSubTab==='docs')  h += rTaxDocsHTML(revData, totalRev);
  else h += rTaxGuideHTML2(totalRev, estIncTax, estInsTax);

  return h;
}

// CSV 다운로드 유틸리티 (Excel 호환)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function downloadCSV(rows, filename){
  // BOM 추가로 한글 깨짐 방지
  const bom = '\uFEFF';
  const csv = bom + rows.map(r=>r.map(v=>{
    const s=String(v===null||v===undefined?'':v);
    return s.includes(',')||s.includes('"')||s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a);
  a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ② 월별 매출 보고서 다운로드
function downloadRevReport(){
  const today=`${TY}${String(TM+1).padStart(2,'0')}${String(TD).padStart(2,'0')}`;
  const MNL=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const rows=[
    [`${STUDIO_CONFIG.name} - 월별 매출 보고서`],
    [`기간: ${TY}년 1월 ~ 12월`],
    [],
    ['월','수업료 수입(원)','강사비 지출(원)','순이익(원)','누계 매출(원)','비고'],
  ];
  let cum=0, totalRev=0, totalExp=0;
  for(let m=0;m<12;m++){
    let rev=0;
    MEMBERS.forEach(mem=>{
      (mem.sections||[]).forEach(s=>{
        if(!s.date) return;
        const parts=s.date.split('-');
        if(parts.length<2) return;
        if(parseInt(parts[1])-1===m) rev+=(s.fee||0);
      });
    });
    const exp=PAYROLL.filter(p=>p.month===m&&p.adminConfirmed).reduce((a,p)=>a+(p.grossPay||0),0);
    cum+=rev; totalRev+=rev; totalExp+=exp;
    rows.push([MNL[m], rev, exp, rev-exp, cum, m===TM?'← 현재월':'']);
  }
  rows.push([]);
  rows.push(['연간 합계', totalRev, totalExp, totalRev-totalExp, '', '']);
  rows.push([]);
  rows.push(['※ 수업료 수입은 섹션지 기록 기준']);
  rows.push(['※ 강사비 지출은 관리자 확정 페이롤 기준']);
  downloadCSV(rows, `매출보고서_${STUDIO_CONFIG.name}_${TY}년.csv`);
  alert('✅ 매출 보고서가 다운로드됐습니다!');
}

    <button class="ops-tab${opsTab==='task'?' on':''}" onclick="opsTab='task';render()">
      ✅<br><span style="font-size:9px;opacity:.8">${OPS_TASKS.filter(t=>!t.done).length}미완</span>
    </button>
    <button class="ops-tab${opsTab==='member'?' on':''}" onclick="opsTab='member';render()"
      style="${opsTab!=='member'&&unresolved?'border-color:var(--red);color:var(--red)':''}">
      🧘<br><span style="font-size:9px;opacity:.8">${unresolved?unresolved+'미처':'회원'}</span>
    </button>
    <button class="ops-tab${opsTab==='inventory'?' on':''}" onclick="opsTab='inventory';render()">
      📦<br><span style="font-size:9px;opacity:.8">${lowStock?lowStock+'부족':'재고'}</span>
    </button>

    ${role==='admin'?`
    <button class="ops-tab${opsTab==='analytics'?' on':''}"
      onclick="opsTab='analytics';analyticsTab='overview';render()"
      style="${opsTab==='analytics'?'':'border-color:var(--teal);color:var(--teal)'}">
      📊<br><span style="font-size:9px;opacity:.8">매출</span>
    </button>`:'<!-- 강사: 매출 탭 없음 -->'}
  </div>`;

  if(opsTab==='dash')           h+=rOpsDashHTML();
  else if(opsTab==='task')      h+=rOpsTaskHTML();
  else if(opsTab==='member')    h+=rOpsMemberCondHTML();
  else if(opsTab==='inventory') h+=rOpsInventoryHTML();
  else if(opsTab==='share')     {}

  h+='<div class="bgap"></div>';
  B.innerHTML=h;
}

function rOpsDashHTML(){
